# Автодеплой стенда: push в master с изменениями platform/ выкладывает их на сервер и
# пересобирает контейнеры там же. Настройка сервера и переменных – docs/deploy.md.
# Переменные репозитория: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_KNOWN_HOSTS, APP_URL.
# Секрет: DEPLOY_SSH_KEY (закрытый ключ пользователя деплоя). Файл .env живёт только на сервере.
name: Deploy stand

on:
  push:
    branches: [master]
    paths:
      - platform/**
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      configure_yandex_only:
        description: Configure Yandex OAuth from repository secrets and restart app only
        type: boolean
        default: false

permissions:
  contents: read

# Новый запуск отменяет предыдущий, пока тот собирает образы (job build): сборка работающий стенд
# не трогает. Начатый перезапуск (job release) не отменяется – GitHub не прерывает job и шаги,
# у которых условие if остаётся истинным, – и новый запуск ждёт его конца.
concurrency:
  group: deploy-stand
  cancel-in-progress: ${{ !inputs.configure_yandex_only }}

env:
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
  COMPOSE: docker compose --progress plain -f docker-compose.yml -f docker-compose.prod.yml
  # Сборка и перезапуск на сервере берут один замок: клиент прежней сборки, если он ещё жив,
  # не пересечётся с новым запуском.
  DEPLOY_LOCK: /tmp/fsp-deploy.lock

jobs:
  build:
    name: Build images
    if: ${{ !inputs.configure_yandex_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # .env сервера в исключениях: rsync --delete его не трогает.
      - name: Upload platform sources
        run: |
          rsync -az --delete \
            --exclude='/.env' --exclude='/node_modules' --exclude='/.next' \
            platform/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      # Сборка падает – прежние контейнеры продолжают работать. -tt: при отмене запуска обрыв
      # соединения завершает клиент сборки на сервере (SIGHUP), BuildKit снимает сборку и образы
      # не перетегирует.
      - name: Build images
        run: |
          ssh -tt "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' \
            && flock -w 600 '$DEPLOY_LOCK' $COMPOSE build" < /dev/null

  release:
    name: Migrate and restart
    needs: build
    # always() держит job и его шаги при отмене запуска: миграции и пересоздание контейнеров
    # доходят до конца. Отмена во время сборки сюда не попадает – результат build не success.
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Set up SSH
        id: ssh
        if: ${{ always() }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Образы уже собраны job build, здесь только миграции, сид и пересоздание контейнеров.
      # Кеш сборки растёт примерно на 1 ГБ за деплой, поэтому после каждого урезается до 3 ГБ.
      - name: Migrate and restart
        id: restart
        if: ${{ always() && steps.ssh.outcome == 'success' }}
        run: |
          # Пути и команда Compose раскрываются на runner, ключи здесь не передаются.
          # shellcheck disable=SC2029
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' \
            && flock -w 600 '$DEPLOY_LOCK' $COMPOSE up -d --no-build --remove-orphans \
            && docker image prune -f \
            && docker builder prune -f --max-used-space 3gb"

      - name: Check health
        if: ${{ always() && steps.restart.outcome == 'success' }}
        run: |
          curl --fail --silent --show-error --max-time 10 \
            --retry 20 --retry-delay 6 --retry-all-errors \
            "$APP_URL/api/health"

  configure-yandex:
    name: Configure Yandex OAuth
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.configure_yandex_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload configuration script
        id: upload
        run: |
          scp platform/scripts/configure-yandex.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/fsp-yandex-$GITHUB_RUN_ID.sh"

      # SSH передаёт ключи через stdin; в удалённой командной строке их нет.
      # always() доводит начатый перезапуск до конца, как в job release.
      - name: Configure and restart app
        id: configure
        if: ${{ always() && steps.upload.outcome == 'success' }}
        env:
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
        run: |
          test -n "$YANDEX_CLIENT_ID" && test -n "$YANDEX_CLIENT_SECRET"
          # Публичные пути раскрываются на runner; секреты передаются только через stdin.
          # shellcheck disable=SC2029
          printf '%s\n' "$YANDEX_CLIENT_ID" "$YANDEX_CLIENT_SECRET" | \
            ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' \
              && flock -w 600 '$DEPLOY_LOCK' bash -c \
              'bash /tmp/fsp-yandex-$GITHUB_RUN_ID.sh .env \
                && $COMPOSE up -d --no-deps --no-build app'"

      - name: Remove configuration script
        if: ${{ always() && steps.upload.outcome == 'success' }}
        run: |
          # shellcheck disable=SC2029
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "rm -f /tmp/fsp-yandex-$GITHUB_RUN_ID.sh"

      - name: Check health
        if: ${{ always() && steps.configure.outcome == 'success' }}
        run: |
          curl --fail --silent --show-error --max-time 10 \
            --retry 20 --retry-delay 6 --retry-all-errors \
            "$APP_URL/api/health"
