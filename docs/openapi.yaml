      security:
        -
          cookieAuth: []
      parameters:
        -
          name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Состояние: вопросы, ответы, вердикт, лимиты, оговорка"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
                description: "Состояние сессии защиты"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postDefenseSessionId
      tags:
        - defense
      summary: "Ответить на вопрос защиты"
      description: "Ответ на текущий вопрос. Пустой ответ допустим («не знаю» оценивается честно). Результат — следующий вопрос или вердикт.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                answer:
                  type: string
                  maxLength: 6000
              required:
                - answer
      responses:
        "200":
          description: "Следующий вопрос или вердикт"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
                description: "Следующий вопрос либо вердикт с итоговым уровнем"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Сессия уже завершена"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/demo/login":
