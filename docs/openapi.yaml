paths:
  "/api/admin/appeals":
    get:
      operationId: getAdminAppeals
      tags:
        - admin
      summary: "Очередь апелляций работодателей на санкцию (`?status=…`): текст, текущая санкция и жалобы, на которых она держится."
      description: "Очередь апелляций работодателей на санкцию (`?status=…`): текст, текущая санкция и жалобы, на которых она держится.\n\nНужна сессия персонала админки (кука fsp_admin: пароль + TOTP); право — по матрице server/admin/permissions.ts, иначе 403."
      security:
        -
          adminCookieAuth: []
      parameters:
        -
          name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: "Очередь апелляций работодателей на санкцию (`?status=…`): текст, текущая санкция и жалобы, на которых она держится."
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/admin/appeals/{id}":
    post:
      operationId: postAdminAppealsId
      tags:
        - admin
      summary: "Решение по апелляции `{ decision: upheld|rejected, reason, complaintIds?"
      description: "Решение по апелляции `{ decision: upheld|rejected, reason, complaintIds? }`. upheld отклоняет выбранные открытые жалобы компании за окно (по умолчанию все) под advisory-lock отправки; rejected санкцию не меняет. Письмо работодателю об итоге.\n\nНужна сессия персонала админки (кука fsp_admin: пароль + TOTP); право — по матрице server/admin/permissions.ts, иначе 403."
      security:
        -
          adminCookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum:
                    - upheld
                    - rejected
                reason:
                  type: string
                  maxLength: 1000
                complaintIds:
                  maxItems: 200
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
              required:
                - decision
                - reason
      responses:
        "200":
          description: "Решение по апелляции `{ decision: upheld|rejected, reason, complaintIds? }`. upheld отклоняет выбранные открытые жалобы"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/admin/applications":
    get:
      operationId: getAdminApplications
      tags:
        - admin
      summary: "Список самооткликов кандидатов на вакансии (право просмотра приглашений)."
      description: "Список самооткликов кандидатов на вакансии (право просмотра приглашений).\n\nНужна сессия персонала админки (кука fsp_admin: пароль + TOTP); право — по матрице server/admin/permissions.ts, иначе 403."
      security:
        -
          adminCookieAuth: []
      parameters:
        -
          name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        -
          name: page
          in: query
          required: false
          schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 10000
        -
          name: status
          in: query
          required: false
          schema:
            type: string
        -
          name: vacancyId
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: "Список самооткликов кандидатов на вакансии (право просмотра приглашений)."
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/admin/audit":
    get:
      operationId: getAdminAudit
      tags:
        - admin
      summary: "Журнал действий персонала (только owner): лента новых сверху, фильтры по сотруднику, действию и объекту, курсор."
      description: "Журнал действий персонала (только owner): лента новых сверху, фильтры по сотруднику, действию и объекту, курсор.\n\nНужна сессия персонала админки (кука fsp_admin: пароль + TOTP); право — по матрице server/admin/permissions.ts, иначе 403."
      security:
        -
          adminCookieAuth: []
      parameters:
        -
          name: actorId
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        -
          name: action
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        -
          name: targetType
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
        -
          name: targetId
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        -
          name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        -
          name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: "Журнал действий персонала (только owner): лента новых сверху, фильтры по сотруднику, действию и объекту, курсор."
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/admin/auth/demo":
    post:
      operationId: postAdminAuthDemo
      tags:
        - admin
      summary: "Демо-вход жюри в админку: только при DEMO_LOGIN (иначе 403)."
      description: "Демо-вход жюри в админку: только при DEMO_LOGIN (иначе 403). Без пароля и TOTP — сотрудник-owner `demo-owner@admin.demo` с правом только на чтение; изменения и раскрытие ПДн отвечают 403.\n\nВход не нужен."
      security: []
      responses:
        "200":
          description: "Демо-вход жюри в админку: только при DEMO_LOGIN (иначе 403). Без пароля и TOTP — сотрудник-owner"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/admin/auth/login":
    post:
      operationId: postAdminAuthLogin
      tags:
        - admin
      summary: "Вход персонала, шаг 1: почта и пароль."
      description: "Вход персонала, шаг 1: почта и пароль. Верно → промежуточная кука fsp_admin_pre (5 минут) и следующий шаг: `totp` — ввести код, `setup` — TOTP ещё не настроен, в ответе секрет и otpauth-URI для приложения-аутентификатора. Неверная пара или отключённый сотрудник — 401 без уточнения.\n\nВход не нужен."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                email:
                  type: string
                  minLength: 3
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
              required:
                - email
                - password
      responses:
        "200":
          description: "Вход персонала, шаг 1: почта и пароль. Верно → промежуточная кука fsp_admin_pre (5 минут) и следующий шаг:"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/admin/auth/logout":
    post:
      operationId: postAdminAuthLogout
      tags:
        - admin
      summary: "Выход персонала: сессия отзывается в БД, кука fsp_admin стирается."
      description: "Выход персонала: сессия отзывается в БД, кука fsp_admin стирается.\n\nНужна сессия персонала админки (кука fsp_admin: пароль + TOTP); право — по матрице server/admin/permissions.ts, иначе 403."
      security:
        -
          adminCookieAuth: []
      responses:
        "200":
          description: "Выход персонала: сессия отзывается в БД, кука fsp_admin стирается."
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/admin/auth/me":
    get:
      operationId: getAdminAuthMe
      tags:
        - admin
      summary: "Кто вошёл в админку: сотрудник, роль и список его прав (для интерфейса; решает всё равно сервер)."
      description: "Кто вошёл в админку: сотрудник, роль и список его прав (для интерфейса; решает всё равно сервер).\n\nНужна сессия персонала админки (кука fsp_admin: пароль + TOTP); право — по матрице server/admin/permissions.ts, иначе 403."
      security:
        -
          adminCookieAuth: []
      responses:
        "200":
          description: "Кто вошёл в админку: сотрудник, роль и список его прав (для интерфейса; решает всё равно сервер)."
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/admin/auth/password":
    post:
      operationId: postAdminAuthPassword
      tags:
        - admin
      summary: "Смена своего пароля (временный пароль из приглашения меняют после первого входа)."
      description: "Смена своего пароля (временный пароль из приглашения меняют после первого входа). Прочие сессии отзываются.\n\nНужна сессия персонала админки (кука fsp_admin: пароль + TOTP); право — по матрице server/admin/permissions.ts, иначе 403."
      security:
        -
          adminCookieAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                current:
                  type: string
                  minLength: 1
                  maxLength: 256
                next:
                  type: string
                  minLength: 8
                  maxLength: 128
              required:
                - current
                - next
      responses:
        "200":
          description: "Смена своего пароля (временный пароль из приглашения меняют после первого входа). Прочие сессии отзываются."
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/admin/auth/totp":
    post:
      operationId: postAdminAuthTotp
      tags:
        - admin
      summary: "Вход персонала, шаг 2: код TOTP (RFC 6238, 6 цифр, шаг 30 с)."
      description: "Вход персонала, шаг 2: код TOTP (RFC 6238, 6 цифр, шаг 30 с). Нужна кука fsp_admin_pre из шага 1. Верный код → кука сессии fsp_admin и `{ next: \"/admin\" }`; при первом входе код включает TOTP.\n\nВход не нужен."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: "^\\d{6}$"
              required:
                - code
      responses:
        "200":
          description: "Вход персонала, шаг 2: код TOTP (RFC 6238, 6 цифр, шаг 30 с). Нужна кука fsp_admin_pre из шага 1."
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/admin/candidates":
    get:
      operationId: getAdminCandidates
      tags:
        - admin
      summary: "Список кандидатов: псевдоним вместо ФИО, текущая категория; поиск по id и псевдониму (по почте и имени — тем, кто вправе раскрывать ПДн)."
      description: "Список кандидатов: псевдоним вместо ФИО, текущая категория; поиск по id и псевдониму (по почте и имени — тем, кто вправе раскрывать ПДн).\n\nНужна сессия персонала админки (кука fsp_admin: пароль + TOTP); право — по матрице server/admin/permissions.ts, иначе 403."
      security:
        -
          adminCookieAuth: []
      parameters:
        -
          name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        -
          name: page
          in: query
          required: false
          schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 10000
        -
          name: specialization
          in: query
          required: false
          schema:
            type: string
        -
          name: grade
          in: query
          required: false
          schema:
            type: string
        -
          name: fsp
          in: query
          required: false
          schema:
            type: string
        -
          name: hidden
          in: query
          required: false
          schema:
            type: string
        -
          name: demo
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: "Список кандидатов: псевдоним вместо ФИО, текущая категория; поиск по id и псевдониму (по почте и имени — тем, кто вправе раскрывать ПДн)."
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/admin/candidates/{id}":
    get:
      operationId: getAdminCandidatesId
      tags:
        - admin
      summary: "Карточка кандидата: категория, попытки теста, утверждения, согласия, приглашения, жалобы."
      description: "Карточка кандидата: категория, попытки теста, утверждения, согласия, приглашения, жалобы. ПДн — только через /pii.\n\nНужна сессия персонала админки (кука fsp_admin: пароль + TOTP); право — по матрице server/admin/permissions.ts, иначе 403."
      security:
        -
          adminCookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
