openapi: "3.1.0"
info:
  title: "ФСП Карьера - API платформы"
  version: "0.1.0"
  description: "REST API платформы подбора ИТ-специалистов (ТЗ ФСП, R-N-06). Файл сгенерирован из кода (`platform/scripts/build-openapi.ts`), руками не править.\n\nВход — подписанная кука `cid` (HttpOnly, SameSite=Lax); выставляется входом через Яндекс ID, демо-входом или сбросом на онбординг. Изменяющие запросы проверяются на Origin (CSRF): чужой Origin → 403.\n\nВсе ошибки имеют единый формат `{ error: { code, message, details? } }` и HTTP-статус; `code` — машинный код (`validation_failed`, `unauthorized`, `session_stale`, `busy` …).\n\nСлужебные маршруты `/api/dev/*` (только для разработки) в спецификацию не входят.\n\n### События SSE\n\nЭндпоинты `POST /api/consultant/messages` и `POST /api/employer/assistant/messages` отвечают потоком `text/event-stream`. Один кадр — `data: <json>` и пустая строка; тип события — поле `type`. Реплика приходит стримом: `delta* → message → done`; `message` — итог реплики, авторитетный. Схемы кадров — `ConsultantEvent` и `EmployerEvent`.\n\nВторой ход в том же разговоре, пока идёт первый, получает 409 с кодом `busy` до начала потока. Ошибка посреди хода приходит событием `error`, поток всё равно заканчивается `done`."
servers:
  -
    url: "/"
    description: "Тот же origin, что и интерфейс"
tags:
  -
    name: auth
    description: "Вход, сессия, согласие на обработку ПДн, роль"
  -
    name: claims
    description: "Карточки утверждений кандидата: подтвердить, поправить, отклонить"
  -
    name: consultant
    description: "Чат с консультантом (SSE) и история разговоров"
  -
    name: defense
    description: "Защита утверждения: короткое интервью, повышающее уровень до «платформа»"
  -
    name: demo
    description: "Демо-вход и демо-резюме (только при DEMO_LOGIN)"
  -
    name: employer
    description: "Кабинет работодателя: потребности, подборка, поиск, приглашения, помощник (SSE)"
  -
    name: health
    description: "Проверка живости"
  -
    name: invitations
    description: "Приглашения глазами кандидата"
  -
    name: onboarding
    description: "Онбординг: шаги, ответы, итог"
  -
    name: openapi
    description: "Спецификация API"
  -
    name: profile
    description: "Профиль кандидата и приватность"
  -
    name: recommendations
    description: "Рекомендации: тест, пробелы, задания, вакансии"
  -
    name: stt
    description: "Голосовой ввод (Yandex SpeechKit)"
  -
    name: test
    description: "Тест на грейд: попытки, ответы, итог"
  -
    name: tts
    description: tts
  -
    name: uploads
    description: "Загрузка резюме и документов"
paths:
  "/api/auth/consent":
    get:
      operationId: getAuthConsent
      tags:
        - auth
      summary: "Версия текста согласия на обработку ПДн"
      description: "Текущая версия текста согласия (docs/consent.md).\n\nВход не нужен."
      security: []
      responses:
        "200":
          description: "Текущая версия текста согласия"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  version:
                    type: string
                required:
                  - version
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postAuthConsent
      tags:
        - auth
      summary: "Зафиксировать согласие на обработку ПДн (R-C-14)."
      description: "Зафиксировать согласие на обработку ПДн (R-C-14). Устаревшая версия → 409.\n\nНужна сессия аккаунта любой роли (кука cid)."
      security:
        -
          cookieAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                version:
                  type: string
                  minLength: 1
                  maxLength: 64
              required:
                - version
      responses:
        "200":
          description: "Согласие записано"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  version:
                    type: string
                  acceptedAt:
                    type: string
                    format: date-time
                required:
                  - version
                  - acceptedAt
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "Версия текста согласия устарела (`conflict`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/login":
    post:
      operationId: postAuthLogin
      tags:
        - auth
      summary: "Вход по почте и паролю"
      description: "Вход по почте и паролю. Неверная почта или пароль — 401 invalid_credentials; почта не подтверждена — 403.\n\nВход не нужен."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                next:
                  oneOf:
                    -
                      type: string
                      description: "Куда вести после входа; только внутренние пути"
                    -
                      type: "null"
              required:
                - email
                - password
      responses:
        "200":
          description: "Вход выполнен, выставлена кука cid"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  next:
                    type: string
                    description: "Куда вести: /onboarding или кабинет роли"
                required:
                  - next
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: "Неверная почта или пароль — одинаковый ответ (`invalid_credentials`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: "Почта не подтверждена, новый код отправлен (`email_not_verified`; `details.devCode` — только на локальном стенде) или чужой Origin"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: "Слишком много попыток (`rate_limited`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/logout":
    post:
      operationId: postAuthLogout
      tags:
        - auth
      summary: "Выход"
      description: "Выход: только POST (GET-выход можно дёрнуть картинкой с чужого сайта). Куку стирает. Запрос с `Accept: text/html` получает 303 на /auth.\n\nВход не нужен."
      security: []
      responses:
        "200":
          description: "Кука стёрта (запрос не из HTML-формы)"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "303":
          description: "HTML-форма: редирект на /auth"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/me":
    get:
      operationId: getAuthMe
      tags:
        - auth
      summary: "Текущий вход"
      description: "Текущий вход. `{ user: null }` — не вошёл. Старая кука демо-кандидата без аккаунта → `{ user: null, legacyCandidateId }`.\n\nВход не нужен."
      security:
        - {}
        -
          cookieAuth: []
      responses:
        "200":
          description: "Текущий вход. `user: null` — не вошёл; `legacyCandidateId` — старая кука демо-кандидата без аккаунта"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      -
                        type: object
                        properties:
                          id:
                            type: string
                          role:
                            type: string
                            description: "candidate, employer или pending"
                          name:
                            type: string
                          email:
                            oneOf:
                              -
                                type: string
                              -
                                type: "null"
                          isDemo:
                            type: boolean
                          candidateId:
                            oneOf:
                              -
                                type: string
                              -
                                type: "null"
                          employerProfileId:
                            oneOf:
                              -
                                type: string
                              -
                                type: "null"
                          onboarded:
                            type: boolean
                          consent:
                            type: boolean
                            description: "Согласие текущей версии дано"
                        required:
                          - id
                          - role
                          - name
                          - email
                          - isDemo
                          - candidateId
                          - employerProfileId
                          - onboarded
                          - consent
                      -
                        type: "null"
                  legacyCandidateId:
                    type: string
                required:
                  - user
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/onboarding/complete":
    post:
      operationId: postAuthOnboardingComplete
      tags:
        - auth
      summary: "Завершить онбординг"
      description: "Завершить онбординг: нужна роль и согласие текущей версии, иначе 409. Ответ — куда вести дальше.\n\nНужна сессия аккаунта любой роли (кука cid)."
      security:
        -
          cookieAuth: []
      responses:
        "200":
          description: "Онбординг завершён"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  onboarded:
                    const: true
                  next:
                    type: string
                    description: "Куда вести дальше (путь интерфейса)"
                required:
                  - onboarded
                  - next
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "Не выбрана роль или нет согласия текущей версии (`conflict`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/password/forgot":
    post:
      operationId: postAuthPasswordForgot
      tags:
        - auth
      summary: "Код сброса пароля письмом"
      description: "Код сброса пароля письмом. Всегда 200 `{ sent: true }`: не раскрываем, есть ли аккаунт.\n\nВход не нужен."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
      responses:
        "200":
          description: "Всегда `{ sent: true }`: не раскрываем, есть ли аккаунт"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  sent:
                    const: true
                required:
                  - sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: "Чужой Origin (`forbidden`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: "Слишком много попыток с клиента (`rate_limited`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: "Письмо не ушло (`mail_unavailable`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/api/auth/password/reset":
    post:
      operationId: postAuthPasswordReset
      tags:
        - auth
      summary: "Новый пароль по коду из письма"
      description: "Смена пароля по коду; после смены прежние сессии аккаунта отзываются, выставляется новая кука cid.\n\nВход не нужен."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  description: "6 цифр из письма"
                password:
                  type: string
                  description: "Новый пароль, 8–128 символов"
                next:
                  oneOf:
                    -
                      type: string
                    -
                      type: "null"
              required:
                - email
                - code
                - password
      responses:
        "200":
          description: "Пароль сменён, вход выполнен"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  next:
                    type: string
                    description: "Куда вести: /onboarding или кабинет роли"
                required:
                  - next
        "400":
          description: "Неверный, просроченный или исчерпанный код (`invalid_code`, `code_expired`, `code_exhausted`) либо слабый пароль"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: "Чужой Origin (`forbidden`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: "Слишком много попыток (`rate_limited`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/register":
    post:
      operationId: postAuthRegister
      tags:
        - auth
      summary: "Регистрация по почте"
      description: "Регистрация по почте (R-D-04): код подтверждения уходит письмом. Ответ не раскрывает, занята ли почта.\n\nВход не нужен."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "Почта; приводится к нижнему регистру"
                  format: email
                password:
                  type: string
                  description: "Пароль, 8–128 символов"
                name:
                  type: string
                  description: "Имя, до 120 символов"
                consent:
                  type: string
                  description: "Версия текста согласия из GET /api/auth/consent (R-C-14); без неё аккаунт не создаётся"
              required:
                - email
                - password
                - consent
      responses:
        "200":
          description: "Код подтверждения отправлен. Ответ одинаковый и для занятой почты; `devCode` — только на локальном стенде"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  sent:
                    const: true
                  devCode:
                    type: string
                required:
                  - sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: "Чужой Origin (`forbidden`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: "Слишком много попыток с клиента или писем на почту (`rate_limited`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: "Письмо не ушло: SMTP недоступен (`mail_unavailable`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/api/auth/role":
    post:
      operationId: postAuthRole
      tags:
        - auth
      summary: "Выбрать роль (кандидат или работодатель)"
      description: "Выбор роли в онбординге (один раз). Перевыпускает куку с новой ролью.\n\nНужна сессия аккаунта любой роли (кука cid)."
      security:
        -
          cookieAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              oneOf:
                -
                  type: object
                  properties:
                    role:
                      type: string
                      const: candidate
                  required:
                    - role
                -
                  type: object
                  properties:
                    role:
                      type: string
                      const: employer
                    companyName:
                      type: string
                      minLength: 2
                      maxLength: 120
                  required:
                    - role
                    - companyName
      responses:
        "200":
          description: "Роль выбрана; выставлена новая кука cid"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  role:
                    type: string
                  candidateId:
                    oneOf:
                      -
                        type: string
                      -
                        type: "null"
                  employerProfileId:
                    oneOf:
                      -
                        type: string
                      -
                        type: "null"
                required:
                  - role
                  - candidateId
                  - employerProfileId
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "Роль уже выбрана или не дано согласие (`conflict`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/stale":
    get:
      operationId: getAuthStale
      tags:
        - auth
      summary: "Сбросить протухшую сессию"
      description: "Страничный guard шлёт сюда, когда кука подписана верно, а аккаунта в БД нет. Стирает куку, только если она и вправду протухла; живую сессию не трогает.\n\nВход не нужен."
      security: []
      parameters:
        -
          name: next
          in: query
          required: false
          description: "Куда вернуть после входа; принимаются только внутренние пути"
          schema:
            type: string
      responses:
        "303":
          description: "Редирект 303: на /auth?next=… (кука стёрта) или на `next` (кука живая)"
          headers:
            Location:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/verify":
    post:
      operationId: postAuthVerify
      tags:
        - auth
      summary: "Подтвердить почту кодом из письма"
      description: "Код из письма → почта подтверждена, вход (кука `cid`).\n\nВход не нужен."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  description: "6 цифр из письма"
                next:
                  oneOf:
                    -
                      type: string
                      description: "Куда вести после входа; только внутренние пути"
                    -
                      type: "null"
              required:
                - email
                - code
      responses:
        "200":
          description: "Почта подтверждена, выставлена кука cid"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  next:
                    type: string
                    description: "Куда вести: /onboarding или кабинет роли"
                required:
                  - next
        "400":
          description: "Неверный, просроченный или исчерпанный код (`invalid_code`, `code_expired`, `code_exhausted`) либо тело не прошло проверку"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: "Чужой Origin (`forbidden`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: "Слишком много попыток (`rate_limited`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/verify/resend":
    post:
      operationId: postAuthVerifyResend
      tags:
        - auth
      summary: "Выслать код подтверждения заново"
      description: "Выслать код подтверждения заново. Ответ одинаковый для любой почты.\n\nВход не нужен."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
      responses:
        "200":
          description: "Ответ одинаковый для любой почты; `devCode` — только на локальном стенде"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  sent:
                    const: true
                  devCode:
                    type: string
                required:
                  - sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: "Чужой Origin (`forbidden`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: "Слишком много попыток (`rate_limited`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: "Письмо не ушло (`mail_unavailable`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/api/auth/yandex":
    get:
      operationId: getAuthYandex
      tags:
        - auth
      summary: "Начать вход через Яндекс ID"
      description: "Старт входа через Яндекс ID: state и PKCE verifier в короткоживущей подписанной куке (10 минут), редирект на oauth.yandex.ru. Не настроен или нет согласия — обратно на /auth?error=… .\n\nВход не нужен."
      security: []
      parameters:
        -
          name: consent
          in: query
          required: true
          description: "Версия текста согласия, отмеченная галкой на /auth (из GET /api/auth/consent); без неё в Яндекс не ведём"
          schema:
            type: string
        -
          name: next
          in: query
          required: false
          description: "Куда вернуть после входа; только внутренние пути"
          schema:
            type: string
      responses:
        "303":
          description: "Редирект 303 на oauth.yandex.ru или на /auth?error=yandex_not_configured|consent_required"
          headers:
            Location:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/yandex/callback":
    get:
      operationId: getAuthYandexCallback
      tags:
        - auth
      summary: "Возврат из Яндекс ID"
      description: "Возврат с oauth.yandex.ru: проверка state, обмен кода (PKCE), профиль, создание или поиск аккаунта, новая кука сессии, редирект. Любая ошибка — на /auth?error=<код>, без подробностей и токенов.\n\nВход не нужен."
      security: []
      parameters:
        -
          name: code
          in: query
          required: false
          description: "Код авторизации от Яндекса"
          schema:
            type: string
        -
          name: state
          in: query
          required: false
          description: "Должен совпасть со state из куки старта"
          schema:
            type: string
        -
          name: error
          in: query
          required: false
          description: "Присутствует, если пользователь отказал"
          schema:
            type: string
      responses:
        "303":
          description: "Редирект 303: незавершённый онбординг → /onboarding, иначе `next` или кабинет роли; при ошибке /auth?error=<код>"
          headers:
            Location:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/claims/{id}/{action}":
    post:
      operationId: postClaimsIdAction
      tags:
        - claims
      summary: "Подтвердить, поправить или отклонить утверждение"
      description: "Карточка «да / поправить / нет». `action` — `confirm`, `edit` или `reject`; другое значение — 404. Только владелец: чужое и несуществующее — 404. Тело нужно только для `edit` и меняет лишь формулировку (3–300 символов); отклонённое не оживает (409).\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: action
          in: path
          required: true
          schema:
            type: string
            enum:
              - confirm
              - edit
              - reject
      requestBody:
        required: true
        description: "Только для action = edit"
        content:
          "application/json":
            schema:
              type: object
              properties:
                statement:
                  type: string
                  description: "Новая формулировка, 3–300 символов"
              required:
                - statement
      responses:
        "200":
          description: "Обновлённое утверждение"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  claim:
                    $ref: "#/components/schemas/Claim"
                required:
                  - claim
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Утверждение уже отклонено или в неподходящем статусе (`conflict`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/claims/confirm-batch":
    post:
      operationId: postClaimsConfirmBatch
      tags:
        - claims
      summary: "Подтвердить пачку утверждений «со слов»"
      description: "Подтвердить все утверждения «со слов»: одна транзакция, только свои утверждения уровня self_reported.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                ids:
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
              required:
                - ids
      responses:
        "200":
          description: "Результат пакетного подтверждения (сколько подтверждено, какие id пропущены)"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
                description: "Счётчики и список подтверждённых утверждений"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/consultant/conversations":
    get:
      operationId: getConsultantConversations
      tags:
        - consultant
      summary: "Список разговоров кандидата"
      description: "Разговоры кандидата, свежие первыми.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      responses:
        "200":
          description: "До 50 разговоров, свежие первыми"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                        - id
                        - title
                        - createdAt
                        - updatedAt
                required:
                  - conversations
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/consultant/conversations/{id}":
    get:
      operationId: getConsultantConversationsId
      tags:
        - consultant
      summary: "История разговора"
      description: "История разговора. Только владелец. Служебные строки (system, tool, пустые assistant с вызовами) не отдаются.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Разговор и реплики по порядку"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  conversation:
                    type: object
                    properties:
                      id:
                        type: string
                      title:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                    required:
                      - id
                      - title
                      - createdAt
                      - updatedAt
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        role:
                          type: string
                          enum:
                            - user
                            - assistant
                        content:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                      required:
                        - id
                        - role
                        - content
                        - createdAt
                required:
                  - conversation
                  - messages
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/consultant/messages":
    post:
      operationId: postConsultantMessages
      tags:
        - consultant
      summary: "Ход консультанта (SSE)"
      description: "Ход консультанта: тело — текст, вложения (id из /api/uploads) и ссылки; ответ — поток событий `ConsultantEvent`, заканчивается `done`. Один ход на разговор одновременно. Первый ход с вложениями запускает конвейер: сборщик → извлекатель → проверяющий → черновики утверждений (события `step`, `claims`). Не больше 6 вызовов инструментов за ход. В теле должен быть текст, вложение или ссылка (иначе 400); `onboardingStep` — свободный вопрос посреди онбординга, нужен вход, согласие и роль кандидата.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                conversationId:
                  type: string
                  minLength: 1
                  maxLength: 64
                text:
                  default: ""
                  type: string
                  maxLength: 8000
                uploadIds:
                  maxItems: 10
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
                urls:
                  maxItems: 10
                  type: array
                  items:
                    type: string
                    maxLength: 2048
                    format: uri
                onboardingStep:
                  type: string
                  pattern: "^[A-Za-z]{1,40}$"
      responses:
        "200":
          description: "Поток событий SSE: кадры `data: <json>\\n\\n`, последним приходит `done`"
          headers:
            X-Conversation-Id:
              schema:
                type: string
              description: "Идентификатор разговора"
          content:
            "text/event-stream":
              schema:
                type: string
                description: "Кадры `data: <json>`; схема кадра — ConsultantEvent"
                x-event-schema:
                  $ref: "#/components/schemas/ConsultantEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Вопрос посреди онбординга без входа или не кандидатом"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Ход в этом разговоре уже идёт (`busy`) или не выполнено условие хода; до начала потока"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/defense":
    post:
      operationId: postDefense
      tags:
        - defense
      summary: "Начать защиту утверждения"
      description: "Начать (или продолжить активную) защиту утверждения: короткое интервью из 3–5 вопросов, оценщик по рубрике, порог и уровень решает код.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                claimId:
                  type: string
                  minLength: 1
                  maxLength: 64
              required:
                - claimId
      responses:
        "200":
          description: "Продолжена активная сессия (`resumed: true`)"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
                description: "Та же форма, что у 201"
        "201":
          description: "Новая сессия защиты и первый вопрос"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
                description: "Сессия защиты: id, утверждение, первый вопрос, лимиты, оговорка; `resumed` — продолжена активная сессия"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Утверждение не найдено или чужое"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: "Утверждение нельзя защищать в текущем состоянии или исчерпаны лимиты"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/defense/{sessionId}":
    get:
      operationId: getDefenseSessionId
