          description: "Согласие отозвано"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  kind:
                    type: string
                  revokedAt:
                    type: string
                    format: date-time
                  deletedRecordings:
                    type: integer
                    description: "Удалено аудиозаписей (только call_recording)"
                required:
