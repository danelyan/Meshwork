      operationId: getProjectTasksFeed
      tags:
        - project-tasks
      summary: "Лента обезличенных проектных заданий направления и грейда кандидата"
      description: "лента обезличенных проектных заданий направления и грейда кандидата (ADR 0003, п. 6): без компании, потребности и зарплаты; с условием и видимыми тестами; лимит активных. Порядок: взятые, своя подкатегория (категория кандидата или онбординг), соседние того же направления.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      responses:
        "200":
          description: "Лента обезличенных проектных заданий направления и грейда кандидата"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/recommendations":
    get:
      operationId: getRecommendations
      tags:
        - recommendations
      summary: "Рекомендации кандидату"
      description: "Тест, пробелы к выбранной цели, задания под пробелы и цели-вакансии. Всё детерминированно и считается по подтверждённым утверждениям. Цель `vacancy:<id>` или `category:<spec>:<grade>`; по умолчанию — категория из теста, иначе лучшая вакансия.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: target
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
            pattern: "^(vacancy:[A-Za-z0-9_-]{1,64}|category:(backend|frontend|ai|engineering):(junior|middle|senior))$"
        -
          name: limit
          in: query
          required: false
          schema:
            default: 5
            type: integer
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: "Рекомендации"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  target:
                    type: string
                  test:
                    type: object
                    additionalProperties: true
                    description: "Рекомендация теста: специализация, грейд, покрытие, пояснение"
                  gaps:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      description: "Пробел: запись каталога, приоритет"
                  tasks:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      description: "Задание из банка"
                  targets:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      description: "Вакансия: «закрываешь k из n»"
                required:
                  - target
                  - test
                  - gaps
                  - tasks
                  - targets
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/simulator":
    post:
      operationId: postSimulator
      tags:
        - simulator
      summary: "Прогнать виртуального кандидата через адаптивный тест"
      description: "Боевой движок теста на грейд (выбор задания по информации Фишера, EAP-оценка θ, остановка и дозадавание по политике текущей версии) на виртуальном кандидате с заданной истинной θ. Режимы ответов: ideal (2PL по экспертным a, b), noise (шум b на показ), leak (трюк по 30 % семейств). Детерминированно по seed, без БД и LLM. Лимит частоты - 120 прогонов за 10 минут с адреса.\n\nВход не нужен."
      security: []
      requestBody:
        required: true
        description: "Виртуальный кандидат"
        content:
          "application/json":
            schema:
              type: object
              properties:
                subcategoryId:
                  type: string
                  description: "Подкатегория с полным банком, например backend.web-api"
                claimed:
                  type: string
                  enum:
                    - junior
                    - middle
                    - senior
                theta:
                  type: number
                  minimum: -3
                  maximum: 3
                  description: "Истинный уровень виртуального кандидата"
                mode:
                  type: string
                  enum:
                    - ideal
                    - noise
                    - leak
                seed:
                  type: integer
                  description: "0..2147483647, по умолчанию 1"
              required:
                - subcategoryId
                - claimed
                - theta
      responses:
        "200":
          description: "Шаги теста и итог"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
                description: "input, policyVersion, steps [{n, templateId, title, itemGrade, a, b, phase, pModel, correct, theta, se}], start, confirmed, offeredGrade, grade, pPass, theta, se, stopReason, length, correctCount, cuts"
        "400":
          description: "Не JSON, не прошла схема или у подкатегории нет теста"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: "Чужой Origin"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: "Тело больше 2 КБ"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: "Слишком много прогонов"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
