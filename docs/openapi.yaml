  "/api/fsp-id/callback":
    get:
      operationId: getFspIdCallback
      tags:
        - fsp-id
      summary: "Возврат из ФСП ID"
      description: "Проверка state и кандидата потока, обмен кода с PKCE, проверка ID-токена (подпись по JWKS, iss, aud, exp, nonce), привязка участника к профилю. Токены в URL не попадают.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: code
          in: query
          required: false
          description: "Код авторизации"
          schema:
            type: string
        -
          name: state
          in: query
          required: false
          description: "Должен совпасть со state из куки старта"
          schema:
            type: string
        -
          name: error
          in: query
          required: false
          description: "Присутствует при отказе"
          schema:
            type: string
      responses:
        "303":
          description: "Редирект на /settings?fsp=linked|no_achievements|unavailable или /settings?fsp=error_<код>"
          headers:
            Location:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/fsp-id/link":
    get:
      operationId: getFspIdLink
      tags:
        - fsp-id
      summary: "Начать привязку ФСП ID"
      description: "Кнопка в настройках кандидата: state, nonce и PKCE verifier — в подписанной httpOnly-куке на 10 минут (path /api/fsp-id), редирект на authorization endpoint. Без сессии кандидата — на /auth.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: return
          in: query
          required: false
          schema:
            type: string
      responses:
        "303":
          description: "Редирект на страницу входа ФСП ID"
          headers:
            Location:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/fsp-id/realms/fsp/protocol/openid-connect/auth":
    get:
      operationId: getFspIdRealmsFspProtocolOpenidConnectAuth
      tags:
        - fsp-id
      summary: "Мок ФСП ID: страница входа"
      description: "Authorization endpoint встроенного мока ФСП ID (путь как у Keycloak); только пока внешний провайдер не настроен, иначе 404. Проверяет client_id и redirect_uri по белому списку, PKCE S256, state и nonce; отдаёт HTML-страницу выбора демо-участника.\n\nВход не нужен."
      security: []
      responses:
        "200":
          description: "HTML-страница входа; ошибка запроса — редирект на redirect_uri с error или страница ошибки"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postFspIdRealmsFspProtocolOpenidConnectAuth
      tags:
        - fsp-id
      summary: "Мок ФСП ID: выбор демо-участника"
      description: "Форма страницы входа мока: одноразовый код на 60 секунд и редирект на redirect_uri с code и state; «Отмена» — error=access_denied.\n\nВход не нужен."
      security: []
      responses:
        "303":
          description: "Редирект на /api/fsp-id/callback"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/health":
    get:
      operationId: getHealth
      tags:
        - health
      summary: "Проверка живости приложения и БД"
      description: "200 — приложение и БД живы; 503 — БД недоступна. Секретов и конфигурации не раскрывает.\n\nВход не нужен."
