    get:
      operationId: getAuthYandexCallback
      tags:
        - auth
      summary: "Возврат из Яндекс ID"
      description: "Возврат с oauth.yandex.ru: проверка state, обмен кода (PKCE), профиль, создание или поиск аккаунта, новая кука сессии, редирект. Любая ошибка — на /auth?error=<код>, без подробностей и токенов.\n\nВход не нужен."
      security: []
      parameters:
        -
          name: code
          in: query
          required: false
          description: "Код авторизации от Яндекса"
          schema:
            type: string
        -
          name: state
          in: query
          required: false
          description: "Должен совпасть со state из куки старта"
          schema:
            type: string
        -
          name: error
          in: query
          required: false
          description: "Присутствует, если пользователь отказал"
          schema:
            type: string
      responses:
        "303":
          description: "Редирект 303: незавершённый онбординг → /consultant (лента знакомства), иначе `next` или кабинет роли; при ошибке /auth?error=<код>"
          headers:
            Location:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call":
    get:
      operationId: getCall
      tags:
        - call
      summary: "Мои созвоны и согласие на запись"
      description: "свои созвоны (свежие первыми) и состояние согласия на запись. `consent.mode`: audio — запись идёт; text — согласие отозвано, созвон без записи голоса (ADR 0005); ask — спросить перед созвоном.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: kind
          in: query
          required: false
          schema:
            type: string
            enum:
              - qualifying
              - defense
              - interview
      responses:
        "200":
          description: "Состояние согласия на запись и созвоны кандидата (свежие первыми, до 10)"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  consent:
                    type: object
                    properties:
                      given:
                        type: boolean
                      mode:
                        type: string
                        enum:
                          - audio
                          - text
                          - ask
                        description: "`audio` — запись разрешена; `text` — согласие отозвано, созвон идёт текстом без записи голоса; `ask` — согласия не было, спросить"
                      version:
                        type: string
                      text:
                        type: array
                        items:
                          type: string
                    required:
                      - given
                      - mode
                      - version
                      - text
                  calls:
                    type: array
                    items:
                      $ref: "#/components/schemas/CallView"
                required:
                  - consent
                  - calls
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call/{id}":
    get:
      operationId: getCallId
      tags:
        - call
      summary: "Созвон: статус, транскрипт, вердикт"
      description: "статус, транскрипт и вердикт с учётом роли: кандидату — всё; работодателю до принятого приглашения — только оценки по темам (`access: summary`), после — всё.\n\nНужна любая сессия (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Созвон с учётом роли"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CallView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "Нет созвона или нет доступа"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call/{id}/audio":
    post:
      operationId: postCallIdAudio
      tags:
        - call
      summary: "Сегмент голоса кандидата"
      description: "сегмент голоса кандидата (LPCM 16 бит моно 16 кГц, `audio/l16`, до 3 МБ): сохраняется файлом созвона; при STT=yandex сразу распознаётся. Ответ `{audioRef, text}` → `/turn`.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: "LPCM 16 бит, моно, 16 кГц, до 3 МБ (~90 с)"
        content:
          "audio/l16":
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: "Сегмент сохранён (WAV на диске); `text` — распознано SpeechKit или null (распознаёт браузер)"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  audioRef:
                    type: string
                    description: "Имя сегмента NNN.wav"
                  text:
                    oneOf:
                      -
                        type: string
                      -
                        type: "null"
                required:
                  - audioRef
                  - text
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Созвон завершён, лимит сегментов, параллельная загрузка или согласие на запись отозвано (`call_recording_off`: созвон идёт текстом)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: "Сегмент длиннее ~90 секунд"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call/{id}/employer-audio":
    get:
      operationId: getCallIdEmployerAudio
      tags:
        - call
      summary: "Сегменты голоса работодателя в живой защите"
      description: "сегменты голоса работодателя в живой защите (ADR 0008 п. 3). Доступ как к записи защиты: кандидату — своя; работодателю — только компании-владельцу живой защиты после принятого приглашения.\n\nНужна любая сессия (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Список сегментов"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  segments:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: "NNN-<startMs>.webm"
                        startMs:
                          type: integer
                      required:
                        - name
                        - startMs
                required:
                  - segments
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Работодатель без действующего раскрытия (Г5)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: "Нет защиты, ИИ-защита или чужая живая защита"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call/{id}/employer-audio/file":
    get:
      operationId: getCallIdEmployerAudioFile
      tags:
        - call
      summary: "Сегмент голоса работодателя"
      description: "один сегмент голоса работодателя (доступ как к списку).\n\nНужна любая сессия (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: segment
          in: query
          required: false
          description: "Имя сегмента из GET /api/call/{id}/employer-audio"
          schema:
            type: string
      responses:
        "200":
          description: "WebM/Opus"
          content:
            "audio/webm":
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Работодатель без действующего раскрытия (Г5)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: "Нет защиты, сегмента или доступа"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call/{id}/events":
    get:
      operationId: getCallIdEvents
      tags:
        - call
      summary: "События созвона (SSE)"
      description: "поток событий созвона (SSE, `text/event-stream`): первым `snapshot`, дальше `utterance`, `status`, `ai_state`, `participant`, `mute`, `question`, `verdict`, `signal`, `error`. Кадр — `event: <type>` + `data: <json>`. Работодатель без доступа к записи получает только статус и оценки.\n\nНужна любая сессия (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Поток `text/event-stream`: кадры `event: <type>` + `data: <json>` (схема CallEvent), первым — snapshot; пинг-комментарий раз в 15 с"
          content:
            "text/event-stream":
              schema:
                $ref: "#/components/schemas/CallEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call/{id}/finish":
    post:
      operationId: postCallIdFinish
      tags:
        - call
      summary: "Завершить созвон и получить карту глубины"
      description: "завершить созвон: слепой оценщик (3 прогона, медиана) строит карту глубины; подтверждённые темы поднимают утверждения до platform. Повтор после 503 — пересчёт.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Созвон с вердиктом (без ответов — cancelled без вердикта)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CallView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Оценка уже идёт или созвон закрыт без оценки"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: "Оценщик недоступен (`llm_unavailable`); ответы сохранены. Запусков оценщика на созвон не больше 3 — после третьего сбоя созвон закрывается (cancelled)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/api/call/{id}/interrupt":
    post:
      operationId: postCallIdInterrupt
      tags:
        - call
      summary: "Кандидат перебил реплику ИИ"
      description: "кандидат заговорил, пока ИИ говорил (режим звонка). Реплика ИИ в транскрипте обрезается до услышанных предложений, хвост остаётся интервьюеру как недосказанное.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/InterruptBody"
      responses:
        "200":
          description: "Реплика ИИ обрезана до услышанного (пометка «…(перебит)»), хвост — в `meta.interrupted.tail`; повтор идемпотентен, полностью услышанная реплика не меняется"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
                description: "Реплика транскрипта (TranscriptEntry)"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Нет такой реплики ИИ"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: "Созвон завершён или это не текущий вопрос"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call/{id}/recording":
    get:
      operationId: getCallIdRecording
      tags:
        - call
      summary: "Аудио ответов кандидата"
      description: "аудио ответов кандидата одним WAV (или один сегмент). Кандидату — всегда; работодателю — только после принятого приглашения (иначе 403).\n\nНужна любая сессия (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: segment
          in: query
          required: false
          description: "Один сегмент NNN.wav; без параметра — все сегменты одним WAV"
          schema:
            type: string
      responses:
        "200":
          description: "WAV (PCM 16 бит, 16 кГц)"
          content:
            "audio/wav":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Работодатель без принятого приглашения"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: "Нет созвона, нет доступа или аудио не записывалось"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call/{id}/signal":
    post:
      operationId: postCallIdSignal
      tags:
        - call
      summary: "POST `{ to?, sdp?"
      description: "POST `{ to?, sdp? , ice? }` — сигналинг WebRTC (ADR 0003): описание сессии или ICE-кандидат доставляется собеседнику через его SSE (`signal`). Работодатель — подключённый участник, адресат — кандидат; кандидат указывает `to: \"employer:<userId>\"`. Собеседник не на связи — 409 `peer_offline`.\n\nНужна любая сессия (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SignalInput"
      responses:
        "200":
          description: "POST `{ to?, sdp? , ice? }` — сигналинг WebRTC (ADR 0003): описание сессии или ICE-кандидат"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call/{id}/turn":
    post:
      operationId: postCallIdTurn
      tags:
        - call
      summary: "Реплика кандидата"
      description: "реплика кандидата; в ответе следующая реплика ИИ `{text, done}` (озвучивает клиент через /api/tts). Без text — сервер распознаёт сегмент audioRef.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/TurnBody"
      responses:
        "200":
          description: "Реплика кандидата и следующая реплика ИИ (`ai: null` — ИИ выключен работодателем); `done: true` — вопросы закончились, дальше finish"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  candidate:
                    type: object
                    additionalProperties: true
                    description: "Реплика кандидата"
                  ai:
                    oneOf:
                      -
                        type: object
                        additionalProperties: true
                        description: "Реплика ИИ"
                      -
                        type: "null"
                  text:
                    oneOf:
                      -
                        type: string
                      -
                        type: "null"
                  audioUrl:
                    type: string
                    description: "Зарезервировано; озвучка — через /api/tts"
                  done:
                    type: boolean
                required:
                  - candidate
                  - ai
                  - text
                  - done
        "400":
          description: "Пустой текст ответа: распознаёт /audio или браузер, /turn сам STT не зовёт"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Чужой созвон или сегмент аудио"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: "Созвон завершён или ответ уже принят"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call/{id}/video":
