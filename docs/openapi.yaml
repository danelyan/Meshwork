              const: delta
            id:
              type: string
            text:
              type: string
          required:
            - type
            - id
            - text
          description: "Очередной кусок реплики `id` по мере генерации"
        -
          type: object
          properties:
            type:
              const: discard
            id:
              type: string
          required:
            - type
            - id
