        -
          cookieAuth: []
      responses:
        "200":
          description: "Согласия аккаунта"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                          description: "Вид согласия"
                        title:
                          type: string
                        label:
                          type: string
                        paragraphs:
                          type: array
                          items:
                            type: string
                        currentVersion:
                          type: string
                        version:
                          oneOf:
                            -
                              type: string
                            -
                              type: "null"
                        acceptedAt:
                          oneOf:
                            -
                              type: string
                              format: date-time
                            -
                              type: "null"
                        revokedAt:
                          oneOf:
                            -
                              type: string
                              format: date-time
                            -
                              type: "null"
                        state:
                          type: string
                          enum:
                            - active
                            - outdated
                            - revoked
                            - none
                        requiredFor:
                          oneOf:
                            -
                              type: string
                            -
                              type: "null"
                        revoke:
                          type: string
                          enum:
                            - button
                            - erase
                            - per_invitation
                        invitationId:
                          type: string
                        company:
                          type: string
                        docUrl:
                          type: string
                      required:
                        - kind
                        - title
                        - currentVersion
                        - version
                        - acceptedAt
                        - revokedAt
                        - state
                        - revoke
                required:
                  - items
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postConsents
      tags:
        - consents
      summary: "Дать согласие"
      description: "Записать согласие на текущую версию текста. Повтор при действующем не создаёт дубля. Показ профиля снимает скрытие; раскрытие (`identity_disclosure`) — только по своему принятому приглашению (`context.invitationId`).\n\nНужна сессия аккаунта любой роли (кука cid)."
      security:
        -
          cookieAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/GrantConsentBody"
      responses:
        "201":
          description: "Согласие записано"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  kind:
                    type: string
                  version:
                    type: string
                  acceptedAt:
                    type: string
                    format: date-time
                required:
                  - kind
                  - version
                  - acceptedAt
        "400":
          description: "Раскрытие без `context.invitationId`"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Приглашение для раскрытия не найдено или чужое"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: "Версия текста устарела или приглашение не принято (`conflict`)"
          content:
