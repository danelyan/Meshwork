                  minLength: 1
                  maxLength: 64
                text:
                  type: string
                  minLength: 1
                  maxLength: 4000
              required:
                - text
      responses:
        "200":
          description: "Поток событий SSE: кадры `data: <json>\\n\\n`, последним приходит `done`"
          headers:
            X-Conversation-Id:
              schema:
                type: string
              description: "Идентификатор разговора"
          content:
            "text/event-stream":
              schema:
                type: string
                description: "Кадры `data: <json>`; схема кадра — EmployerEvent"
                x-event-schema:
                  $ref: "#/components/schemas/EmployerEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Ход в этом разговоре уже идёт (`busy`) или не выполнено условие хода; до начала потока"
          content:
