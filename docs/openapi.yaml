        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/recommendations":
    get:
      operationId: getRecommendations
      tags:
        - recommendations
      summary: "Рекомендации кандидату"
      description: "Тест, пробелы к выбранной цели, задания под пробелы и цели-вакансии. Всё детерминированно и считается по подтверждённым утверждениям. Цель `vacancy:<id>` или `category:<spec>:<grade>`; по умолчанию — категория из теста, иначе лучшая вакансия.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: target
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
            pattern: "^(vacancy:[A-Za-z0-9_-]{1,64}|category:(backend|frontend):(junior|middle))$"
        -
          name: limit
          in: query
          required: false
          schema:
            default: 5
            type: integer
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: "Рекомендации"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  target:
                    type: string
                  test:
                    type: object
                    additionalProperties: true
                    description: "Рекомендация теста: специализация, грейд, покрытие, пояснение"
                  gaps:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      description: "Пробел: запись каталога, приоритет"
                  tasks:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      description: "Задание из банка"
                  targets:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      description: "Вакансия: «закрываешь k из n»"
                required:
                  - target
                  - test
                  - gaps
                  - tasks
                  - targets
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/stt":
    get:
      operationId: getStt
      tags:
        - stt
      summary: "Режим голосового ввода"
      description: "Какой распознаватель доступен композеру: yandex / browser / off.\n\nВход не нужен."
      security: []
      responses:
        "200":
          description: "Режим голосового ввода"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    enum:
                      - yandex
                      - browser
                      - "off"
                  sampleRate:
                    type: integer
                  maxBytes:
                    type: integer
                required:
                  - mode
                  - sampleRate
                  - maxBytes
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postStt
      tags:
        - stt
      summary: "Распознать речь"
      description: "Голос в текст через Yandex SpeechKit. Тело — LPCM 16 бит, моно, 16 кГц (`audio/l16`), до 1 МБ (около 30 секунд). Только для вошедших. Аудио не сохраняется. Если режим не `yandex` — 400.\n\nНужна любая сессия (кука cid)."
      security:
        -
          cookieAuth: []
      requestBody:
        required: true
        description: "Сырое аудио"
        content:
          "audio/l16":
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: "Распознанный текст"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  text:
                    type: string
                required:
                  - text
        "400":
          description: "Серверное распознавание выключено или запись пустая"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: "Запись длиннее 30 секунд"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/test/attempt/{id}":
    get:
      operationId: getTestAttemptId
      tags:
        - test
      summary: "Состояние попытки теста"
      description: "Состояние попытки: текущее задание без ключа и прогресс; после завершения — итог с разбором. Чужая попытка — 404.\n\nНужна сессия кандидата (кука cid)."
