                  type: object
                  properties:
                    role:
                      type: string
                      const: employer
                    companyName:
                      type: string
                      minLength: 2
                      maxLength: 120
                  required:
                    - role
                    - companyName
      responses:
        "200":
          description: "Роль выбрана; выставлена новая кука cid"
