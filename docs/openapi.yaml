        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/me":
    get:
      operationId: getAuthMe
      tags:
        - auth
      summary: "Текущий вход"
      description: "Текущий вход. `{ user: null }` — не вошёл. Старая кука демо-кандидата без аккаунта → `{ user: null, legacyCandidateId }`.\n\nВход не нужен."
      security:
        - {}
        -
          cookieAuth: []
      responses:
        "200":
          description: "Текущий вход. `user: null` — не вошёл; `legacyCandidateId` — старая кука демо-кандидата без аккаунта"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      -
                        type: object
                        properties:
                          id:
                            type: string
                          role:
                            type: string
                            description: "candidate, employer или pending"
                          name:
                            type: string
                          email:
                            oneOf:
                              -
                                type: string
                              -
                                type: "null"
                          isDemo:
                            type: boolean
                          candidateId:
                            oneOf:
                              -
                                type: string
                              -
                                type: "null"
                          employerProfileId:
                            oneOf:
                              -
                                type: string
                              -
                                type: "null"
                          onboarded:
                            type: boolean
                          consent:
                            type: boolean
                            description: "Согласие текущей версии дано"
                          onboardingProgress:
                            oneOf:
                              -
                                type: object
                                properties:
                                  done:
                                    type: integer
                                  total:
                                    type: integer
                                required:
                                  - done
                                  - total
                                description: "Закрыто шагов знакомства из скольки (пропуск считается закрытым); null — знакомство завершено или не посчитать"
                              -
                                type: "null"
                        required:
                          - id
                          - role
                          - name
                          - email
                          - isDemo
                          - candidateId
                          - employerProfileId
                          - onboarded
                          - consent
                          - onboardingProgress
                      -
                        type: "null"
                  legacyCandidateId:
                    type: string
                required:
                  - user
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/onboarding/complete":
    post:
