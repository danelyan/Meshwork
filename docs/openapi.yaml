        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: action
          in: path
          required: true
          schema:
            type: string
            enum:
              - confirm
              - edit
              - reject
      requestBody:
        required: true
        description: "Только для action = edit"
        content:
          "application/json":
            schema:
              type: object
              properties:
                statement:
                  type: string
                  description: "Новая формулировка, 3–300 символов; меняет и wording, и statement"
              required:
                - statement
      responses:
        "200":
          description: "Обновлённое утверждение"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  claim:
                    $ref: "#/components/schemas/Claim"
                required:
                  - claim
