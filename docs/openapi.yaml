  "/api/onboarding":
    get:
      operationId: getOnboarding
      tags:
        - onboarding
      summary: "Состояние онбординга"
      description: "Состояние онбординга: текущий шаг, лента, прогресс, итог (OnboardingView).\n\nНужна сессия аккаунта любой роли (кука cid)."
      security:
        -
          cookieAuth: []
      responses:
        "200":
          description: "Текущий шаг, лента, прогресс, итог"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/OnboardingView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postOnboarding
      tags:
        - onboarding
      summary: "Действие онбординга"
      description: "Ответить на шаг (`answer`), пропустить (`skip`), вернуться (`goto`) или отложить (`later`: у кандидата шаги встают на паузу, лента /consultant продолжается свободным разговором; снимает паузу любой `answer`/`skip`/`goto`). После `answer`/`skip`/`goto` — новое состояние; при смене роли выставляется новая кука cid. Завершение — `POST /api/auth/onboarding/complete`.\n\nНужна сессия аккаунта любой роли (кука cid)."
      security:
        -
          cookieAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              oneOf:
                -
                  type: object
                  properties:
                    action:
                      type: string
                      const: answer
                    stepId:
                      type: string
                      pattern: "^[A-Za-z]{1,40}$"
                    value: {}
                  required:
                    - action
                    - stepId
                    - value
                -
                  type: object
                  properties:
                    action:
                      type: string
                      const: skip
                    stepId:
                      type: string
                      pattern: "^[A-Za-z]{1,40}$"
                  required:
                    - action
                    - stepId
                -
                  type: object
                  properties:
                    action:
                      type: string
                      const: goto
                    stepId:
                      type: string
                      pattern: "^[A-Za-z]{1,40}$"
                  required:
                    - action
                    - stepId
                -
                  type: object
                  properties:
                    action:
                      type: string
                      const: later
                  required:
                    - action
      responses:
        "200":
          description: "Новое состояние онбординга (`later` — `{ next }` без завершения)"
          content:
            "application/json":
              schema:
                oneOf:
                  -
                    $ref: "#/components/schemas/OnboardingView"
                  -
                    type: object
                    properties:
                      next:
                        type: string
                    required:
                      - next
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "Шаг недоступен в текущем состоянии"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
