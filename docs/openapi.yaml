  "/api/recommendations":
    get:
      operationId: getRecommendations
      tags:
        - recommendations
      summary: "Рекомендации кандидату"
      description: "Тест, пробелы к выбранной цели, задания под пробелы и цели-вакансии. Всё детерминированно и считается по подтверждённым утверждениям. Цель `vacancy:<id>` или `category:<spec>:<grade>`; по умолчанию — категория из теста, иначе лучшая вакансия.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: target
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
            pattern: "^(vacancy:[A-Za-z0-9_-]{1,64}|category:(backend|frontend):(junior|middle))$"
        -
          name: limit
          in: query
          required: false
          schema:
            default: 5
            type: integer
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: "Рекомендации"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  target:
                    type: string
                  test:
                    type: object
                    additionalProperties: true
                    description: "Рекомендация теста: специализация, грейд, покрытие, пояснение"
                  gaps:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      description: "Пробел: запись каталога, приоритет"
                  tasks:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      description: "Задание из банка"
                  targets:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      description: "Вакансия: «закрываешь k из n»"
                required:
                  - target
                  - test
                  - gaps
                  - tasks
                  - targets
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
