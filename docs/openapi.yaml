        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: startMs
          in: query
          required: false
          description: "Смещение начала сегмента от начала созвона, мс"
          schema:
            type: string
      requestBody:
        required: true
        description: "WebM с камеры (комната звонка), до 8 МБ (~60 с при 300 кбит/с)"
        content:
          "video/webm":
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: "Сегмент сохранён файлом созвона; в БД — ничего. Видео не анализируется"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: "Имя сегмента NNN-<startMs>.webm"
                  startMs:
                    type: integer
                required:
                  - name
                  - startMs
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Созвон завершён, лимит сегментов, параллельная загрузка или нет согласия на запись (`call_recording_off`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: "Сегмент больше 8 МБ"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call/consent":
    post:
      operationId: postCallConsent
      tags:
