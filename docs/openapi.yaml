      description: "POST `{ contact }` — почта или Telegram; пустая строка или null — убрать. Компания увидит контакт только после принятия приглашения.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CandidateContactInput"
      responses:
        "200":
          description: "POST `{ contact }` — почта или Telegram; пустая строка или null — убрать. Компания увидит контакт только после принятия приглашения."
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/profile/privacy":
