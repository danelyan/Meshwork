      tags:
        - tts
      summary: "Доступна ли озвучка аватару: yandex / elevenlabs / off."
      description: "Доступна ли озвучка аватару: yandex / elevenlabs / off.\n\nВход не нужен."
      security: []
      responses:
        "200":
          description: "Доступна ли озвучка аватару: yandex / elevenlabs / off."
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postTts
      tags:
        - tts
      summary: "Текст ответа компаньона → аудио SpeechKit (mp3 по умолчанию)."
      description: "Текст ответа компаньона → аудио SpeechKit (mp3 по умолчанию). Только для вошедших, ≤ 1000 знаков после чистки markdown, лимит запросов на сессию. Аудио не хранится: ответ SpeechKit сразу уходит клиенту.\n\nВход не нужен."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 4000
                voice:
                  type: string
                  enum:
                    - companion
                    - employer
                realtime:
                  type: boolean
              required:
                - text
      responses:
        "200":
          description: "Текст ответа компаньона → аудио SpeechKit (mp3 по умолчанию). Только для вошедших, ≤ 1000 знаков"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/uploads":
    post:
      operationId: postUploads
      tags:
        - uploads
      summary: "Загрузить резюме или документ"
      description: "Загрузка резюме или документа: PDF, DOCX, MD, TXT или CSV до 5 МБ (PDF до 20 страниц). Хранится извлечённый текст с координатами и оригинал файла (<UPLOAD_DIR>/<candidateId>/<sha256>, только после успешного разбора). Повтор того же файла (sha256) у того же кандидата возвращает прежнюю запись без второй копии.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      requestBody:
        required: true
        description: "`kind` по умолчанию — resume"
        content:
          "multipart/form-data":
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: "Файл PDF, DOCX, MD, TXT или CSV"
                  format: binary
                kind:
                  type: string
                  enum:
                    - resume
                    - document
              required:
                - file
      responses:
        "200":
          description: "Тот же файл уже загружен (`deduplicated: true`)"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  uploadId:
                    type: string
                  deduplicated:
                    type: boolean
                  doc:
                    type: object
                    additionalProperties: true
                    description: "Метаданные документа"
                required:
                  - uploadId
                  - deduplicated
                  - doc
        "201":
          description: "Файл разобран"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  uploadId:
                    type: string
                    description: "Передаётся в POST /api/consultant/messages как uploadIds[]"
                  deduplicated:
                    type: boolean
                  doc:
                    type: object
                    properties:
                      title:
                        type: string
                      sourceKind:
                        type: string
                      lines:
                        type: integer
                      pages:
                        oneOf:
                          -
                            type: integer
                          -
                            type: "null"
                      flags:
                        type: object
                        additionalProperties: true
                        description: "hiddenText, injectionSuspect, truncated, empty"
                      preview:
                        type: string
                        description: "Первые 300 символов"
                    required:
                      - title
                      - sourceKind
                      - lines
                      - pages
                      - flags
                      - preview
                required:
                  - uploadId
                  - deduplicated
                  - doc
        "400":
          description: "Нет файла в поле file, пустой файл или multipart не разобран"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: "Файл больше 5 МБ"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "Нужен multipart/form-data"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/uploads/{id}":
    delete:
      operationId: deleteUploadsId
      tags:
        - uploads
      summary: "Удалить загруженный файл"
      description: "Удаляет оригинал с диска и запись. Неподтверждённые утверждения из файла удаляются, подтверждённые и исправленные человеком остаются.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Удалено"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  deletedClaims:
                    type: integer
                    description: "Удалено черновиков"
                  keptClaims:
                    type: integer
                    description: "Осталось подтверждённых и исправленных"
                required:
                  - deletedClaims
                  - keptClaims
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Нет файла или чужой"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/uploads/{id}/file":
    get:
      operationId: getUploadsIdFile
      tags:
        - uploads
      summary: "Скачать оригинал загруженного файла"
      description: "Оригинал файла владельцу: всегда `Content-Disposition: attachment` (filename* по RFC 5987), `X-Content-Type-Options: nosniff`, тип — только PDF/DOCX, иначе application/octet-stream.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Файл PDF, DOCX, MD, TXT или CSV"
          content:
            "application/octet-stream":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Нет файла, чужой или загружен до хранения оригиналов"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cid
      description: "Подписанная сессионная кука платформы"
    adminCookieAuth:
      type: apiKey
      in: cookie
      name: fsp_admin
      description: "Сессия персонала админки (ADR 0009): вход /api/admin/auth/login + /api/admin/auth/totp"
  schemas:
    AiDefenseStartInput:
      type: object
      properties:
        projectSubmissionId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
      required:
        - projectSubmissionId
    ApplicationAnswer:
      type: object
      properties:
        action:
          type: string
          enum:
            - accept
            - decline
      required:
        - action
    ApplicationInput:
      type: object
      properties:
        message:
          anyOf:
            -
              type: string
              maxLength: 1000
            -
              type: "null"
        disclosureVersion:
          type: string
          minLength: 1
          maxLength: 64
    CallConsentBody:
      type: object
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - version
    CallEvent:
      description: "Кадр SSE созвона: `event: <type>` + `data: <json>`; `type` — различитель. Enum типов — CALL_EVENT_TYPES (server/call/types.ts); participant / mute / question / signal шлёт lane defense-room. Работодатель без доступа к записи получает только status, participant и verdict (без цитат)"
      oneOf:
        -
          type: object
          properties:
            type:
              const: snapshot
            call:
              $ref: "#/components/schemas/CallView"
          required:
            - type
            - call
          description: "Первый кадр: состояние созвона для этой роли"
        -
          type: object
          properties:
            type:
              const: status
            status:
              type: string
              enum:
                - active
                - finished
                - cancelled
          required:
            - type
            - status
          description: "Сменился статус"
        -
          type: object
          properties:
            type:
              const: utterance
            entry:
              type: object
              additionalProperties: true
              description: "Реплика транскрипта {index, role, text, at, tMs, audioRef?, meta?}"
          required:
            - type
            - entry
          description: "Новая реплика"
        -
          type: object
          properties:
            type:
              const: ai_state
            state:
              type: string
              enum:
                - thinking
                - idle
          required:
            - type
            - state
          description: "ИИ готовит реплику / закончил"
        -
          type: object
          properties:
            type:
              const: participant
            userId:
              type: string
            role:
              type: string
              enum:
                - employer
            action:
              type: string
              enum:
                - joined
                - left
          required:
            - type
            - userId
            - role
            - action
          description: "Участник вошёл или вышел"
        -
          type: object
          properties:
            type:
              const: mute
            aiMuted:
              type: boolean
            userId:
              type: string
          required:
            - type
            - aiMuted
            - userId
          description: "Работодатель выключил/включил ИИ"
        -
          type: object
          properties:
            type:
              const: question
            questionId:
              type: string
            status:
              type: string
              enum:
                - queued
                - asked
                - answered
          required:
            - type
            - questionId
            - status
          description: "Вопрос работодателя"
        -
          type: object
          properties:
            type:
              const: verdict
            verdict:
              type: object
              additionalProperties: true
              description: "Карта глубины: depthMap [{topic, catalogId, claimed, probed, maxLevel, confirmed, scores, total, quote}], summary, runs, validRuns, upgradedCatalogIds"
          required:
            - type
            - verdict
          description: "Готов вердикт оценщика"
        -
          type: object
          properties:
            type:
              const: signal
            from:
              type: string
            to:
              type: string
            payload:
              type: object
              additionalProperties: true
              description: "SDP или ICE-кандидат"
          required:
            - type
            - from
            - payload
          description: "Сигналинг WebRTC (defense-room)"
        -
          type: object
          properties:
            type:
              const: error
            code:
              type: string
            message:
              type: string
          required:
            - type
            - code
            - message
          description: "Ошибка на сервере"
      discriminator:
        propertyName: type
    CallView:
      type: object
      additionalProperties: true
      description: "Созвон глазами роли: id, kind (qualifying | defense), status (active | finished | cancelled), projectSubmissionId, startedAt, finishedAt, access (full | summary), transcript — реплики {index, role: ai | candidate | employer, text, at, tMs, audioRef?, meta?} или null при summary, verdict (карта глубины; при summary — без цитат), hasRecording, progress {answered, minQuestions, maxQuestions, canFinish, awaitingAnswer}, participants, policyVersion, disclaimer"
    CandidateContactInput:
      type: object
      properties:
        contact:
          anyOf:
            -
              type: string
              const: ""
            -
              type: "null"
            -
              type: string
              minLength: 1
              maxLength: 120
      required:
        - contact
    Claim:
      type: object
      properties:
        id:
          type: string
        catalogId:
          type: string
          description: "Запись каталога навыков"
        statement:
          type: string
          description: "Формулировка утверждения из каталога (или правка кандидата) — то, что проверяется на созвоне"
        wording:
          oneOf:
            -
              type: string
              description: "Формулировка для кандидата в границах цитаты; null — старая запись, показывать statement"
            -
              type: "null"
        level:
          type: string
          enum:
            - self_reported
            - artifact
            - third_party
            - platform
        quote:
          oneOf:
            -
              type: string
              description: "Цитата из источника"
            -
              type: "null"
        sourceRef:
          oneOf:
            -
              type: string
            -
              type: "null"
        sourceKind:
          type: string
        status:
          type: string
          description: "proposed, confirmed, rejected"
        confirmedAt:
          oneOf:
            -
              type: string
              format: date-time
            -
              type: "null"
      required:
        - id
        - catalogId
        - statement
        - wording
        - level
        - quote
        - sourceRef
        - sourceKind
        - status
        - confirmedAt
      description: "Утверждение кандидата с уровнем доказанности"
    CompanyPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          anyOf:
            -
              type: string
              maxLength: 600
            -
              type: "null"
        industry:
          anyOf:
            -
              type: string
              maxLength: 80
            -
              type: "null"
        inn:
          type:
            - string
            - "null"
        contact:
          type:
            - string
            - "null"
      additionalProperties: false
    ComplaintInput:
      type: object
      properties:
        reason:
          type: string
          enum:
            - spam
            - salary_mismatch
            - offensive
            - fake_company
            - other
        comment:
          anyOf:
            -
              type: string
              maxLength: 1000
            -
              type: "null"
      required:
        - reason
    ConsultantEvent:
      description: "Кадр SSE хода консультанта (`type` — различитель)"
      oneOf:
        -
          type: object
          properties:
            type:
              const: conversation
            id:
              type: string
          required:
            - type
            - id
          description: "Первый кадр: id разговора (новый создаётся на первом ходе)"
        -
          type: object
          properties:
            type:
              const: step
            text:
              type: string
          required:
            - type
            - text
          description: "Статус работы агента, например «читаю резюме…»"
        -
          type: object
          properties:
            type:
              const: queue
            position:
              type: integer
          required:
            - type
            - position
          description: "Место в очереди к модели"
        -
          type: object
          properties:
            type:
              const: ask
            question:
              type: string
            options:
              type: array
              items:
                type: string
          required:
            - type
            - question
          description: "Агент задаёт кандидату вопрос; ход на этом заканчивается"
        -
          type: object
          properties:
            type:
              const: delta
            id:
              type: string
            text:
              type: string
          required:
            - type
            - id
            - text
          description: "Очередной кусок реплики `id` по мере генерации"
        -
          type: object
          properties:
            type:
              const: discard
            id:
              type: string
          required:
            - type
            - id
          description: "Показанный текст реплики `id` не был ответом (модель ушла в инструменты): убрать"
        -
          type: object
          properties:
            type:
              const: message
            text:
              type: string
            id:
              type: string
          required:
            - type
            - text
          description: "Итог реплики, авторитетный; заменяет накопленные дельты `id`"
        -
          type: object
          properties:
            type:
              const: error
            code:
              type: string
            message:
              type: string
          required:
            - type
            - code
            - message
          description: "Ошибка хода; следом придёт `done`"
        -
          type: object
          properties:
            type:
              const: done
          required:
            - type
          description: "Последний кадр потока"
        -
          type: object
          properties:
            type:
              const: claims
            proposed:
              type: array
              items:
                type: object
            rejected:
              type: integer
            rejectedByReason:
              type: object
              additionalProperties:
                type: integer
            hiddenText:
              type: integer
            alreadyKnown:
              type: integer
          required:
            - type
            - proposed
            - rejected
          description: "Карточки утверждений, извлечённые из вложений"
        -
          type: object
          properties:
            type:
              const: recommendations
            items:
              type: array
              items:
                type: object
          required:
            - type
            - items
          description: "Рекомендации для карточек в чате"
        -
          type: object
          properties:
            type:
              const: call_offer
            reason:
              type: string
              description: "Зачем созвон, одной фразой"
          required:
            - type
            - reason
          description: "Агент предлагает созвон (suggest_call): кнопка «Созвониться» в ленте"
      discriminator:
        propertyName: type
    DefenseStartInput:
      oneOf:
        -
          type: object
          properties:
            mode:
              type: string
              const: project
            projectSubmissionId:
              type: string
              minLength: 1
              maxLength: 64
              pattern: "^[A-Za-z0-9_-]+$"
          required:
            - mode
            - projectSubmissionId
        -
          type: object
          properties:
            mode:
              type: string
              const: questions
          required:
            - mode
    DefenseTurnInput:
      type: object
      properties:
        text:
          type: string
          maxLength: 4000
      required:
        - text
    EmployerEvent:
      description: "Кадр SSE хода помощника работодателя (`type` — различитель). Имя кандидата добавляется карточке только после принятия приглашения"
      oneOf:
        -
          type: object
