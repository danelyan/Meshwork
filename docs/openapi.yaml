          minLength: 1
          maxLength: 64
        vacancyId:
          anyOf:
            -
              type: string
              minLength: 1
              maxLength: 64
            -
              type: "null"
        message:
          type: string
          minLength: 10
          maxLength: 2000
        salaryFrom:
          type: integer
          minimum: 1
          maximum: 10000000
        salaryTo:
          type: integer
          minimum: 1
          maximum: 10000000
      required:
        - candidateId
        - message
        - salaryFrom
        - salaryTo
    OnboardingView:
      type: object
      additionalProperties: true
      description: "Состояние онбординга: name, role, scenario, consent {version, docUrl}, progress {done, total}, history, current (шаг), summary, laterTarget, test {href, ready}, onboarded"
    PrivacyInput:
      type: object
      properties:
        hiddenFromEmployers:
          type: boolean
      required:
        - hiddenFromEmployers
    VacancyInput:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        specialization:
          type: string
          enum:
            - backend
            - frontend
        grade:
          type: string
          enum:
            - junior
            - middle
        salaryFrom:
          type: integer
          minimum: 0
          maximum: 10000000
        salaryTo:
          type: integer
          minimum: 0
          maximum: 10000000
        teamDescription:
          anyOf:
            -
              type: string
              maxLength: 2000
            -
              type: "null"
        description:
          anyOf:
            -
              type: string
              maxLength: 2000
            -
              type: "null"
        stack:
          default: []
          maxItems: 15
          type: array
          items:
            type: string
            maxLength: 40
        needs:
          minItems: 1
          maxItems: 25
          type: array
          items:
            type: object
            properties:
              catalogId:
                type: string
                minLength: 1
                maxLength: 64
              weight:
                type: integer
                minimum: 1
                maximum: 3
            required:
              - catalogId
              - weight
      required:
        - title
        - specialization
        - grade
        - salaryFrom
        - salaryTo
        - needs
    VacancyPatch:
      type: object
      properties:
        archived:
          type: boolean
      required:
        - archived
  responses:
    BadRequest:
      description: "Некорректный запрос: тело или query не прошли проверку (`validation_failed`, `details` — список полей) либо иная ошибка запроса (`bad_request`)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Unauthorized:
      description: "Нет входа (`unauthorized`) или кука подписана верно, а аккаунта в БД нет (`session_stale`, клиент ведёт на /auth)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Forbidden:
      description: "Нет доступа: другая роль (`forbidden`) или чужой Origin у изменяющего запроса"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: "Объект не найден; для чужих объектов тоже 404, чтобы не раскрывать их существование (`not_found`)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Conflict:
      description: "Конфликт состояния: повторное действие, занятый ресурс, устаревшая версия (`conflict` и специальные коды операции)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
    PayloadTooLarge:
      description: "Слишком большой запрос (`payload_too_large`)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
    UnsupportedMediaType:
      description: "Неподдерживаемый тип содержимого (`unsupported_media_type`)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
    TooManyRequests:
      description: "Превышен лимит запросов или суточный лимит (`rate_limited`)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
    InternalError:
      description: "Внутренняя ошибка (`internal`); текст исключения наружу не отдаётся"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
    ServiceUnavailable:
      description: "Внешняя служба недоступна, например SMTP (`mail_unavailable`); повторить позже"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
