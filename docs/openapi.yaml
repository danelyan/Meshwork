              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum:
                      - withdrawn
                  withdrawn:
                    type: object
                    properties:
                      at:
                        type: string
                        description: "Время отзыва, ISO 8601"
                      reason:
                        type: string
