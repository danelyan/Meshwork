        - call
      summary: "Сегмент видео с камеры кандидата"
      description: "сегмент видео с камеры кандидата (WebM, до 8 МБ): файл созвона рядом с аудио. Видео не анализируется — хранится как материал созвона (согласие: пункт о камере). Без действующего согласия на запись сегмент не сохраняется: 409 `call_recording_off`, как у аудио.\n\nНужна сессия кандидата (кука cid)."
