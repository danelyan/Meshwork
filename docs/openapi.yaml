      tags:
        - consents
      summary: "Мои согласия"
      description: "Все согласия своей роли (ADR 0005): вид, текущая версия текста, данная версия, даты, состояние; раскрытия — по каждому приглашению с названием компании.\n\nНужна сессия аккаунта любой роли (кука cid)."
