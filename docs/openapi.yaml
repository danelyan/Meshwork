  "/api/test/start":
    get:
      operationId: getTestStart
      tags:
        - test
      summary: "Можно ли начать тест"
      description: "Допуск по интервалам пересдачи (R-C-09) и текст правил.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: specialization
          in: query
          required: true
          schema:
            type: string
            enum:
              - backend
              - frontend
        -
          name: grade
          in: query
          required: true
          schema:
            type: string
            enum:
              - junior
              - middle
      responses:
        "200":
          description: "Допуск и правила"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
                description: "Решение о допуске (`nextAllowedAt`, причина) и `rules` — текст интервалов"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postTestStart
      tags:
        - test
      summary: "Начать попытку теста"
      description: "Начать попытку теста на грейд (R-C-05, R-C-06, R-C-09).\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                specialization:
                  type: string
                  enum:
                    - backend
                    - frontend
                grade:
                  type: string
                  enum:
                    - junior
                    - middle
              required:
                - specialization
                - grade
      responses:
        "200":
          description: "Продолжена активная попытка той же категории (`resumed: true`)"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
                description: "Та же форма, что у 201"
        "201":
          description: "Новая попытка и первое задание"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
                description: "Попытка: id, категория, первое задание без ключа; `resumed`"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "Нельзя начать: активная попытка другой категории (`active_attempt`), смена грейда раньше срока (`grade_change_too_soon`) или пересдача раньше срока (`retake_too_soon`); в `details` — `nextAllowedAt`"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/tts":
    get:
      operationId: getTts
      tags:
        - tts
      summary: "Доступна ли озвучка аватару: yandex / off."
      description: "Доступна ли озвучка аватару: yandex / off.\n\nВход не нужен."
      security: []
      responses:
        "200":
          description: "Доступна ли озвучка аватару: yandex / off."
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postTts
      tags:
        - tts
      summary: "Текст ответа компаньона → аудио SpeechKit (mp3 по умолчанию)."
      description: "Текст ответа компаньона → аудио SpeechKit (mp3 по умолчанию). Только для вошедших, ≤ 1000 знаков после чистки markdown, лимит запросов на сессию. Аудио не хранится: ответ SpeechKit сразу уходит клиенту.\n\nВход не нужен."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 4000
              required:
                - text
      responses:
        "200":
          description: "Текст ответа компаньона → аудио SpeechKit (mp3 по умолчанию). Только для вошедших, ≤ 1000 знаков"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/uploads":
    post:
      operationId: postUploads
      tags:
        - uploads
      summary: "Загрузить резюме или документ"
      description: "Загрузка резюме или документа: PDF или DOCX до 5 МБ и 20 страниц. Сам файл не хранится — только извлечённый текст с координатами. Повтор того же файла (sha256) у того же кандидата возвращает прежнюю запись.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      requestBody:
        required: true
        description: "`kind` по умолчанию — resume"
        content:
          "multipart/form-data":
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: "Файл PDF или DOCX"
                  format: binary
                kind:
                  type: string
                  enum:
                    - resume
                    - document
              required:
                - file
      responses:
        "200":
          description: "Тот же файл уже загружен (`deduplicated: true`)"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  uploadId:
                    type: string
                  deduplicated:
                    type: boolean
                  doc:
                    type: object
                    additionalProperties: true
                    description: "Метаданные документа"
                required:
                  - uploadId
                  - deduplicated
                  - doc
        "201":
          description: "Файл разобран"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  uploadId:
                    type: string
                    description: "Передаётся в POST /api/consultant/messages как uploadIds[]"
                  deduplicated:
                    type: boolean
                  doc:
                    type: object
                    properties:
                      title:
                        type: string
                      sourceKind:
                        type: string
                      lines:
                        type: integer
                      pages:
                        oneOf:
                          -
                            type: integer
                          -
                            type: "null"
                      flags:
                        type: object
                        additionalProperties: true
                        description: "hiddenText, injectionSuspect, truncated, empty"
                      preview:
                        type: string
                        description: "Первые 300 символов"
                    required:
                      - title
                      - sourceKind
                      - lines
                      - pages
                      - flags
                      - preview
                required:
                  - uploadId
                  - deduplicated
                  - doc
        "400":
          description: "Нет файла в поле file, пустой файл или multipart не разобран"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: "Файл больше 5 МБ"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "Нужен multipart/form-data"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cid
      description: "Подписанная сессионная кука платформы"
  schemas:
    CandidateContactInput:
      type: object
      properties:
        contact:
          anyOf:
            -
              type: string
              const: ""
            -
              type: "null"
            -
              type: string
              minLength: 1
              maxLength: 120
      required:
        - contact
    Claim:
      type: object
      properties:
        id:
          type: string
        catalogId:
          type: string
          description: "Запись каталога навыков"
        statement:
          type: string
          description: "Формулировка утверждения"
        level:
          type: string
          enum:
            - self_reported
            - artifact
            - third_party
            - platform
        quote:
          oneOf:
            -
              type: string
              description: "Цитата из источника"
            -
              type: "null"
        sourceRef:
          oneOf:
            -
              type: string
            -
              type: "null"
        sourceKind:
          type: string
        status:
          type: string
          description: "proposed, confirmed, rejected"
        confirmedAt:
          oneOf:
            -
              type: string
              format: date-time
            -
              type: "null"
      required:
        - id
        - catalogId
        - statement
        - level
        - quote
        - sourceRef
        - sourceKind
        - status
        - confirmedAt
      description: "Утверждение кандидата с уровнем доказанности"
    ConsultantEvent:
      description: "Кадр SSE хода консультанта (`type` — различитель)"
      oneOf:
        -
          type: object
          properties:
            type:
              const: conversation
            id:
              type: string
          required:
            - type
            - id
          description: "Первый кадр: id разговора (новый создаётся на первом ходе)"
        -
          type: object
          properties:
            type:
              const: step
            text:
              type: string
          required:
            - type
            - text
          description: "Статус работы агента, например «читаю резюме…»"
        -
          type: object
          properties:
            type:
              const: queue
            position:
              type: integer
          required:
            - type
            - position
          description: "Место в очереди к модели"
        -
          type: object
          properties:
            type:
              const: ask
            question:
              type: string
            options:
              type: array
              items:
                type: string
          required:
            - type
            - question
          description: "Агент задаёт кандидату вопрос; ход на этом заканчивается"
        -
          type: object
          properties:
            type:
              const: delta
            id:
              type: string
            text:
