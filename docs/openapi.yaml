  "/api/fsp-id/callback":
    get:
      operationId: getFspIdCallback
      tags:
        - fsp-id
      summary: "Возврат из ФСП ID"
      description: "Проверка state, обмен кода с PKCE, проверка ID-токена (подпись по JWKS, iss, aud, exp, nonce). Привязка (кука потока mode=link): кандидат сессии = кандидат потока, участник привязывается к профилю. Вход (mode=login): аккаунт по ФСП ID (новый — сразу кандидат), согласие, привязка, кука сессии. Токены в URL не попадают.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: code
          in: query
          required: false
          description: "Код авторизации"
          schema:
            type: string
        -
          name: state
          in: query
          required: false
          description: "Должен совпасть со state из куки старта"
          schema:
            type: string
        -
          name: error
          in: query
          required: false
          description: "Присутствует при отказе"
          schema:
            type: string
      responses:
        "303":
          description: "Привязка: /settings или /consultant с ?fsp=linked|no_achievements|unavailable|error_<код>. Вход: /consultant или next; ошибка — /auth?error=fsp_<код>"
          headers:
            Location:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/fsp-id/link":
    get:
      operationId: getFspIdLink
      tags:
        - fsp-id
      summary: "Начать привязку ФСП ID"
      description: "Кнопка в настройках кандидата: state, nonce и PKCE verifier — в подписанной httpOnly-куке на 10 минут (path /api/fsp-id), редирект на authorization endpoint. Без сессии кандидата — на /auth.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: return
          in: query
          required: false
          schema:
            type: string
      responses:
        "303":
          description: "Редирект на страницу входа ФСП ID"
          headers:
            Location:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
