        - salaryFrom
        - salaryTo
    InviteToDefenseInput:
      type: object
      properties:
        message:
          type: string
          minLength: 10
          maxLength: 2000
        salaryFrom:
          type: integer
          minimum: 1
          maximum: 10000000
        salaryTo:
          type: integer
          minimum: 1
          maximum: 10000000
      required:
        - message
