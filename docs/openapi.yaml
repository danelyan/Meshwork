openapi: "3.1.0"
info:
  title: "ФСП Карьера - API платформы"
  version: "0.1.0"
  description: "REST API платформы подбора ИТ-специалистов (ТЗ ФСП, R-N-06). Файл сгенерирован из кода (`platform/scripts/build-openapi.ts`), руками не править.\n\nВход — подписанная кука `cid` (HttpOnly, SameSite=Lax); выставляется входом через Яндекс ID, демо-входом или сбросом на онбординг. Изменяющие запросы проверяются на Origin (CSRF): чужой Origin → 403.\n\nВсе ошибки имеют единый формат `{ error: { code, message, details? } }` и HTTP-статус; `code` — машинный код (`validation_failed`, `unauthorized`, `session_stale`, `busy` …).\n\nСлужебные маршруты `/api/dev/*` (только для разработки) в спецификацию не входят.\n\n### События SSE\n\nЗвонок защиты проекта `GET /api/defense-room/{id}/events` — EventSource с именованными событиями лейна call: `snapshot`, `status`, `utterance`, `ai_state`, `participant`, `mute`, `question`, `verdict`, `signal`, `error` (кадр `event: <имя>` + `data: <json>`; первым приходит `snapshot`, реплики дедуплицируются по `entry.index`, сигналы WebRTC — только адресату).\n\nЭндпоинты `POST /api/consultant/messages` и `POST /api/employer/assistant/messages` отвечают потоком `text/event-stream`. Один кадр — `data: <json>` и пустая строка; тип события — поле `type`. Реплика приходит стримом: `delta* → message → done`; `message` — итог реплики, авторитетный. Схемы кадров — `ConsultantEvent` и `EmployerEvent`.\n\nВторой ход в том же разговоре, пока идёт первый, получает 409 с кодом `busy` до начала потока. Ошибка посреди хода приходит событием `error`, поток всё равно заканчивается `done`."
servers:
  -
    url: "/"
    description: "Тот же origin, что и интерфейс"
tags:
  -
    name: auth
    description: "Вход, сессия, согласие на обработку ПДн, роль"
  -
    name: call
    description: "Созвон с ИИ-интервьюером (ADR 0003): квалифицирующий созвон, транскрипт, запись, карта глубины, SSE-события, сигналинг WebRTC"
  -
    name: career
    description: career
  -
    name: claims
    description: "Карточки утверждений кандидата: подтвердить, поправить, отклонить"
  -
    name: consultant
    description: "Чат с консультантом (SSE) и история разговоров"
  -
    name: defense
    description: "Защита утверждения: короткое интервью, повышающее уровень до «платформа»"
  -
    name: defense-room
    description: "Защита проекта (ADR 0003, ступень 3): вопросы по коду, ходы, SSE звонка, итог слепого оценщика"
  -
    name: demo
    description: "Демо-вход и демо-резюме (только при DEMO_LOGIN)"
  -
    name: directions
    description: "Справочник направлений и подкатегорий (Subcategory, R-T-05)"
  -
    name: employer
    description: "Кабинет работодателя: потребности, подборка, поиск, приглашения, помощник (SSE)"
  -
    name: evaluate
    description: "Проверка подбора на своём наборе: P@k, nDCG@k, MRR против базовой линии, без записи в БД"
  -
    name: favorites
    description: favorites
  -
    name: fsp-id
    description: "ФСП ID (R-FSP-01): привязка ФСП ID к профилю кандидата через OIDC-провайдер (Keycloak; сейчас — симулятор ФСП ID команды) и загрузка достижений"
  -
    name: health
    description: "Проверка живости"
  -
    name: invitations
    description: "Приглашения глазами кандидата"
  -
    name: notifications
    description: notifications
  -
    name: onboarding
    description: "Онбординг: шаги, ответы, итог"
  -
    name: openapi
    description: "Спецификация API"
  -
    name: profile
    description: "Профиль кандидата и приватность"
  -
    name: project-submissions
    description: project-submissions
  -
    name: project-tasks
    description: project-tasks
  -
    name: recommendations
    description: "Рекомендации: тест, пробелы, задания, вакансии"
  -
    name: sources
    description: "Подключённые ссылки кандидата (GitHub, Codeforces, страницы): удаление"
  -
    name: stt
    description: "Голосовой ввод (Yandex SpeechKit)"
  -
    name: test
    description: "Тест на грейд: попытки, ответы, итог"
  -
    name: tts
    description: tts
  -
    name: uploads
    description: "Загрузка резюме и документов: разбор, оригинал, скачивание, удаление"
paths:
  "/api/auth/account":
    delete:
      operationId: deleteAuthAccount
      tags:
        - auth
      summary: "Delete the authenticated account, both profiles and stored files, then clear its session."
      description: "Delete the authenticated account, both profiles and stored files, then clear its session.\n\nНужна сессия аккаунта любой роли (кука cid)."
      security:
        -
          cookieAuth: []
      responses:
        "200":
          description: "Delete the authenticated account, both profiles and stored files, then clear its session."
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/consent":
    get:
      operationId: getAuthConsent
      tags:
        - auth
      summary: "Версия текста согласия на обработку ПДн"
      description: "Текущая версия текста согласия (docs/consent.md).\n\nВход не нужен."
      security: []
      responses:
        "200":
          description: "Текущая версия текста согласия"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  version:
                    type: string
                required:
                  - version
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postAuthConsent
      tags:
        - auth
      summary: "Зафиксировать согласие на обработку ПДн (R-C-14)."
      description: "Зафиксировать согласие на обработку ПДн (R-C-14). Устаревшая версия → 409.\n\nНужна сессия аккаунта любой роли (кука cid)."
      security:
        -
          cookieAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                version:
                  type: string
                  minLength: 1
                  maxLength: 64
              required:
                - version
      responses:
        "200":
          description: "Согласие записано"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  version:
                    type: string
                  acceptedAt:
                    type: string
                    format: date-time
                required:
                  - version
                  - acceptedAt
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "Версия текста согласия устарела (`conflict`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/login":
    post:
      operationId: postAuthLogin
      tags:
        - auth
      summary: "Вход по почте и паролю"
      description: "Вход по почте и паролю. Неверная почта или пароль — 401 invalid_credentials; почта не подтверждена — 403.\n\nВход не нужен."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                next:
                  oneOf:
                    -
                      type: string
                      description: "Куда вести после входа; только внутренние пути"
                    -
                      type: "null"
              required:
                - email
                - password
      responses:
        "200":
          description: "Вход выполнен, выставлена кука cid"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  next:
                    type: string
                    description: "Куда вести: /consultant (лента знакомства) или кабинет роли"
                required:
                  - next
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: "Неверная почта или пароль — одинаковый ответ (`invalid_credentials`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: "Почта не подтверждена, новый код отправлен (`email_not_verified`; `details.devCode` — только на локальном стенде) или чужой Origin"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: "Слишком много попыток (`rate_limited`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/logout":
    post:
      operationId: postAuthLogout
      tags:
        - auth
      summary: "Выход"
      description: "Выход: только POST (GET-выход можно дёрнуть картинкой с чужого сайта). Куку стирает. Запрос с `Accept: text/html` получает 303 на /auth.\n\nВход не нужен."
      security: []
      responses:
        "200":
          description: "Кука стёрта (запрос не из HTML-формы)"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "303":
          description: "HTML-форма: редирект на /auth"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/me":
    get:
      operationId: getAuthMe
      tags:
        - auth
      summary: "Текущий вход"
      description: "Текущий вход. `{ user: null }` — не вошёл. Старая кука демо-кандидата без аккаунта → `{ user: null, legacyCandidateId }`.\n\nВход не нужен."
      security:
        - {}
        -
          cookieAuth: []
      responses:
        "200":
          description: "Текущий вход. `user: null` — не вошёл; `legacyCandidateId` — старая кука демо-кандидата без аккаунта"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      -
                        type: object
                        properties:
                          id:
                            type: string
                          role:
                            type: string
                            description: "candidate, employer или pending"
                          name:
                            type: string
                          email:
                            oneOf:
                              -
                                type: string
                              -
                                type: "null"
                          isDemo:
                            type: boolean
                          candidateId:
                            oneOf:
                              -
                                type: string
                              -
                                type: "null"
                          employerProfileId:
                            oneOf:
                              -
                                type: string
                              -
                                type: "null"
                          onboarded:
                            type: boolean
                          consent:
                            type: boolean
                            description: "Согласие текущей версии дано"
                          onboardingProgress:
                            oneOf:
                              -
                                type: object
                                properties:
                                  done:
                                    type: integer
                                  total:
                                    type: integer
                                required:
                                  - done
                                  - total
                                description: "Закрыто шагов знакомства из скольки (пропуск считается закрытым); null — знакомство завершено или не посчитать"
                              -
                                type: "null"
                        required:
                          - id
                          - role
                          - name
                          - email
                          - isDemo
                          - candidateId
                          - employerProfileId
                          - onboarded
                          - consent
                          - onboardingProgress
                      -
                        type: "null"
                  legacyCandidateId:
                    type: string
                required:
                  - user
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/onboarding/complete":
    post:
      operationId: postAuthOnboardingComplete
      tags:
        - auth
      summary: "Завершить онбординг"
      description: "Завершить онбординг: нужна роль и согласие текущей версии, иначе 409. Ответ — куда вести дальше.\n\nНужна сессия аккаунта любой роли (кука cid)."
      security:
        -
          cookieAuth: []
      responses:
        "200":
          description: "Онбординг завершён"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  onboarded:
                    const: true
                  next:
                    type: string
                    description: "Куда вести дальше (путь интерфейса)"
                required:
                  - onboarded
                  - next
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "Не выбрана роль или нет согласия текущей версии (`conflict`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/password/forgot":
    post:
      operationId: postAuthPasswordForgot
      tags:
        - auth
      summary: "Код сброса пароля письмом"
      description: "Код сброса пароля письмом. Всегда 200 `{ sent: true }`: не раскрываем, есть ли аккаунт.\n\nВход не нужен."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
      responses:
        "200":
          description: "Всегда `{ sent: true }`: не раскрываем, есть ли аккаунт"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  sent:
                    const: true
                required:
                  - sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: "Чужой Origin (`forbidden`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: "Слишком много попыток с клиента (`rate_limited`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: "Письмо не ушло (`mail_unavailable`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/api/auth/password/reset":
    post:
      operationId: postAuthPasswordReset
      tags:
        - auth
      summary: "Новый пароль по коду из письма"
      description: "Смена пароля по коду; после смены прежние сессии аккаунта отзываются, выставляется новая кука cid.\n\nВход не нужен."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  description: "6 цифр из письма"
                password:
                  type: string
                  description: "Новый пароль, 8–128 символов"
                next:
                  oneOf:
                    -
                      type: string
                    -
                      type: "null"
              required:
                - email
                - code
                - password
      responses:
        "200":
          description: "Пароль сменён, вход выполнен"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  next:
                    type: string
                    description: "Куда вести: /consultant (лента знакомства) или кабинет роли"
                required:
                  - next
        "400":
          description: "Неверный, просроченный или исчерпанный код (`invalid_code`, `code_expired`, `code_exhausted`) либо слабый пароль"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: "Чужой Origin (`forbidden`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: "Слишком много попыток (`rate_limited`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/register":
    post:
      operationId: postAuthRegister
      tags:
        - auth
      summary: "Регистрация по почте"
      description: "Регистрация по почте (R-D-04): код подтверждения уходит письмом. Ответ не раскрывает, занята ли почта.\n\nВход не нужен."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "Почта; приводится к нижнему регистру"
                  format: email
                password:
                  type: string
                  description: "Пароль, 8–128 символов"
                name:
                  type: string
                  description: "Имя, до 120 символов"
                consent:
                  type: string
                  description: "Версия текста согласия из GET /api/auth/consent (R-C-14); без неё аккаунт не создаётся"
              required:
                - email
                - password
                - consent
      responses:
        "200":
          description: "Код подтверждения отправлен. Ответ одинаковый и для занятой почты; `devCode` — только на локальном стенде"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  sent:
                    const: true
                  devCode:
                    type: string
                required:
                  - sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: "Чужой Origin (`forbidden`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: "Слишком много попыток с клиента или писем на почту (`rate_limited`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: "Письмо не ушло: SMTP недоступен (`mail_unavailable`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/api/auth/role":
    post:
      operationId: postAuthRole
      tags:
        - auth
      summary: "Выбрать роль (кандидат или работодатель)"
      description: "Выбор роли в онбординге (один раз). Перевыпускает куку с новой ролью.\n\nНужна сессия аккаунта любой роли (кука cid)."
      security:
        -
          cookieAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              oneOf:
                -
                  type: object
                  properties:
                    role:
                      type: string
                      const: candidate
                  required:
                    - role
                -
                  type: object
                  properties:
                    role:
                      type: string
                      const: employer
                    companyName:
                      type: string
                      minLength: 2
                      maxLength: 120
                  required:
                    - role
                    - companyName
      responses:
        "200":
          description: "Роль выбрана; выставлена новая кука cid"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  role:
                    type: string
                  candidateId:
                    oneOf:
                      -
                        type: string
                      -
                        type: "null"
                  employerProfileId:
                    oneOf:
                      -
                        type: string
                      -
                        type: "null"
                required:
                  - role
                  - candidateId
                  - employerProfileId
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "Роль уже выбрана или не дано согласие (`conflict`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/role/switch":
    post:
      operationId: postAuthRoleSwitch
      tags:
        - auth
      summary: "Переключить активную роль (вторая роль на той же учётке)"
      description: "ADR 0004. Профиль целевой роли есть — переключает; нет — создаёт (работодателю нужна `companyName`, создаётся новая компания) и запускает знакомство этой роли в ленте /consultant. Та же роль — идемпотентно (`changed: false`). Перевыпускает куку cid: в ней id профиля только активной роли. Клиент переходит на `next` полной навигацией.\n\nНужна сессия аккаунта любой роли (кука cid)."
      security:
        -
          cookieAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              oneOf:
                -
                  type: object
                  properties:
                    role:
                      type: string
                      const: candidate
                  required:
                    - role
                -
                  type: object
                  properties:
                    role:
                      type: string
                      const: employer
                    companyName:
                      anyOf:
                        -
                          type: string
                          const: ""
                        -
                          type: string
                          minLength: 2
                          maxLength: 120
                  required:
                    - role
      responses:
        "200":
          description: "Роль активна; выставлена новая кука cid"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  role:
                    type: string
                  next:
                    type: string
                    description: "Дом роли (путь интерфейса)"
                  created:
                    type: boolean
                  changed:
                    type: boolean
                required:
                  - role
                  - next
                  - created
                  - changed
        "400":
          description: "Нет названия компании, когда профиль работодателя надо создать (`bad_request`), или тело не прошло схему (`validation_failed`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "Нет входа (`unauthorized`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: "Старая демо-кука без аккаунта, общий демо-аккаунт без второй роли или запрос с чужого сайта (`forbidden`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: "Роль ещё не выбрана — сначала знакомство (`conflict`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: "Слишком много переключений (`rate_limited`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/stale":
    get:
      operationId: getAuthStale
      tags:
        - auth
      summary: "Сбросить протухшую сессию"
      description: "Страничный guard шлёт сюда, когда кука подписана верно, а аккаунта в БД нет. Стирает куку, только если она и вправду протухла; живую сессию не трогает.\n\nВход не нужен."
      security: []
      parameters:
        -
          name: next
          in: query
          required: false
          description: "Куда вернуть после входа; принимаются только внутренние пути"
          schema:
            type: string
      responses:
        "303":
          description: "Редирект 303: на /auth?next=… (кука стёрта) или на `next` (кука живая)"
          headers:
            Location:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/verify":
    post:
      operationId: postAuthVerify
      tags:
        - auth
      summary: "Подтвердить почту кодом из письма"
      description: "Код из письма → почта подтверждена, вход (кука `cid`).\n\nВход не нужен."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  description: "6 цифр из письма"
                next:
                  oneOf:
                    -
                      type: string
                      description: "Куда вести после входа; только внутренние пути"
                    -
                      type: "null"
              required:
                - email
                - code
      responses:
        "200":
          description: "Почта подтверждена, выставлена кука cid"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  next:
                    type: string
                    description: "Куда вести: /consultant (лента знакомства) или кабинет роли"
                required:
                  - next
        "400":
          description: "Неверный, просроченный или исчерпанный код (`invalid_code`, `code_expired`, `code_exhausted`) либо тело не прошло проверку"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: "Чужой Origin (`forbidden`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: "Слишком много попыток (`rate_limited`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/verify/resend":
    post:
      operationId: postAuthVerifyResend
      tags:
        - auth
      summary: "Выслать код подтверждения заново"
      description: "Выслать код подтверждения заново. Ответ одинаковый для любой почты.\n\nВход не нужен."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
      responses:
        "200":
          description: "Ответ одинаковый для любой почты; `devCode` — только на локальном стенде"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  sent:
                    const: true
                  devCode:
                    type: string
                required:
                  - sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: "Чужой Origin (`forbidden`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: "Слишком много попыток (`rate_limited`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: "Письмо не ушло (`mail_unavailable`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/api/auth/yandex":
    get:
      operationId: getAuthYandex
      tags:
        - auth
      summary: "Начать вход через Яндекс ID"
      description: "Старт входа через Яндекс ID: state и PKCE verifier в короткоживущей подписанной куке (10 минут), редирект на oauth.yandex.ru. Не настроен или нет согласия — обратно на /auth?error=… .\n\nВход не нужен."
      security: []
      parameters:
        -
          name: consent
          in: query
          required: true
          description: "Версия текста согласия, отмеченная галкой на /auth (из GET /api/auth/consent); без неё в Яндекс не ведём"
          schema:
            type: string
        -
          name: next
          in: query
          required: false
          description: "Куда вернуть после входа; только внутренние пути"
          schema:
            type: string
      responses:
        "303":
          description: "Редирект 303 на oauth.yandex.ru или на /auth?error=yandex_not_configured|consent_required"
          headers:
            Location:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/auth/yandex/callback":
    get:
      operationId: getAuthYandexCallback
      tags:
        - auth
      summary: "Возврат из Яндекс ID"
      description: "Возврат с oauth.yandex.ru: проверка state, обмен кода (PKCE), профиль, создание или поиск аккаунта, новая кука сессии, редирект. Любая ошибка — на /auth?error=<код>, без подробностей и токенов.\n\nВход не нужен."
      security: []
      parameters:
        -
          name: code
          in: query
          required: false
          description: "Код авторизации от Яндекса"
          schema:
            type: string
        -
          name: state
          in: query
          required: false
          description: "Должен совпасть со state из куки старта"
          schema:
            type: string
        -
          name: error
          in: query
          required: false
          description: "Присутствует, если пользователь отказал"
          schema:
            type: string
      responses:
        "303":
          description: "Редирект 303: незавершённый онбординг → /consultant (лента знакомства), иначе `next` или кабинет роли; при ошибке /auth?error=<код>"
          headers:
            Location:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call":
    get:
      operationId: getCall
      tags:
        - call
      summary: "Мои созвоны и согласие на запись"
      description: "свои созвоны (свежие первыми) и состояние согласия на запись.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: kind
          in: query
          required: false
          schema:
            type: string
            enum:
              - qualifying
              - defense
              - interview
      responses:
        "200":
          description: "Состояние согласия на запись и созвоны кандидата (свежие первыми, до 10)"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  consent:
                    type: object
                    properties:
                      given:
                        type: boolean
                      version:
                        type: string
                      text:
                        type: array
                        items:
                          type: string
                    required:
                      - given
                      - version
                      - text
                  calls:
                    type: array
                    items:
                      $ref: "#/components/schemas/CallView"
                required:
                  - consent
                  - calls
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call/{id}":
    get:
      operationId: getCallId
      tags:
        - call
      summary: "Созвон: статус, транскрипт, вердикт"
      description: "статус, транскрипт и вердикт с учётом роли: кандидату — всё; работодателю до принятого приглашения — только оценки по темам (`access: summary`), после — всё.\n\nНужна любая сессия (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Созвон с учётом роли"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CallView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "Нет созвона или нет доступа"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call/{id}/audio":
    post:
      operationId: postCallIdAudio
      tags:
        - call
      summary: "Сегмент голоса кандидата"
      description: "сегмент голоса кандидата (LPCM 16 бит моно 16 кГц, `audio/l16`, до 3 МБ): сохраняется файлом созвона; при STT=yandex сразу распознаётся. Ответ `{audioRef, text}` → `/turn`.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: "LPCM 16 бит, моно, 16 кГц, до 3 МБ (~90 с)"
        content:
          "audio/l16":
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: "Сегмент сохранён (WAV на диске); `text` — распознано SpeechKit или null (распознаёт браузер)"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  audioRef:
                    type: string
                    description: "Имя сегмента NNN.wav"
                  text:
                    oneOf:
                      -
                        type: string
                      -
                        type: "null"
                required:
                  - audioRef
                  - text
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Созвон завершён, лимит сегментов или параллельная загрузка"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: "Сегмент длиннее ~90 секунд"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call/{id}/events":
    get:
      operationId: getCallIdEvents
      tags:
        - call
      summary: "События созвона (SSE)"
      description: "поток событий созвона (SSE, `text/event-stream`): первым `snapshot`, дальше `utterance`, `status`, `ai_state`, `participant`, `mute`, `question`, `verdict`, `signal`, `error`. Кадр — `event: <type>` + `data: <json>`. Работодатель без доступа к записи получает только статус и оценки.\n\nНужна любая сессия (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Поток `text/event-stream`: кадры `event: <type>` + `data: <json>` (схема CallEvent), первым — snapshot; пинг-комментарий раз в 15 с"
          content:
            "text/event-stream":
              schema:
                $ref: "#/components/schemas/CallEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call/{id}/finish":
    post:
      operationId: postCallIdFinish
      tags:
        - call
      summary: "Завершить созвон и получить карту глубины"
      description: "завершить созвон: слепой оценщик (3 прогона, медиана) строит карту глубины; подтверждённые темы поднимают утверждения до platform. Повтор после 503 — пересчёт.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Созвон с вердиктом (без ответов — cancelled без вердикта)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CallView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Оценка уже идёт или созвон закрыт без оценки"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: "Оценщик недоступен (`llm_unavailable`); ответы сохранены. Запусков оценщика на созвон не больше 3 — после третьего сбоя созвон закрывается (cancelled)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/api/call/{id}/interrupt":
    post:
      operationId: postCallIdInterrupt
      tags:
        - call
      summary: "Кандидат перебил реплику ИИ"
      description: "кандидат заговорил, пока ИИ говорил (режим звонка). Реплика ИИ в транскрипте обрезается до услышанных предложений, хвост остаётся интервьюеру как недосказанное.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/InterruptBody"
      responses:
        "200":
          description: "Реплика ИИ обрезана до услышанного (пометка «…(перебит)»), хвост — в `meta.interrupted.tail`; повтор идемпотентен, полностью услышанная реплика не меняется"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
                description: "Реплика транскрипта (TranscriptEntry)"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Нет такой реплики ИИ"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: "Созвон завершён или это не текущий вопрос"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call/{id}/recording":
    get:
      operationId: getCallIdRecording
      tags:
        - call
      summary: "Аудио ответов кандидата"
      description: "аудио ответов кандидата одним WAV (или один сегмент). Кандидату — всегда; работодателю — только после принятого приглашения (иначе 403).\n\nНужна любая сессия (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: segment
          in: query
          required: false
          description: "Один сегмент NNN.wav; без параметра — все сегменты одним WAV"
          schema:
            type: string
      responses:
        "200":
          description: "WAV (PCM 16 бит, 16 кГц)"
          content:
            "audio/wav":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Работодатель без принятого приглашения"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: "Нет созвона, нет доступа или аудио не записывалось"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call/{id}/signal":
    post:
      operationId: postCallIdSignal
      tags:
        - call
      summary: "POST `{ to?, sdp?"
      description: "POST `{ to?, sdp? , ice? }` — сигналинг WebRTC (ADR 0003): описание сессии или ICE-кандидат доставляется собеседнику через его SSE (`signal`). Работодатель — подключённый участник, адресат — кандидат; кандидат указывает `to: \"employer:<userId>\"`. Собеседник не на связи — 409 `peer_offline`.\n\nНужна любая сессия (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SignalInput"
      responses:
        "200":
          description: "POST `{ to?, sdp? , ice? }` — сигналинг WebRTC (ADR 0003): описание сессии или ICE-кандидат"
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call/{id}/turn":
    post:
      operationId: postCallIdTurn
      tags:
        - call
      summary: "Реплика кандидата"
      description: "реплика кандидата; в ответе следующая реплика ИИ `{text, done}` (озвучивает клиент через /api/tts). Без text — сервер распознаёт сегмент audioRef.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/TurnBody"
      responses:
        "200":
          description: "Реплика кандидата и следующая реплика ИИ (`ai: null` — ИИ выключен работодателем); `done: true` — вопросы закончились, дальше finish"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  candidate:
                    type: object
                    additionalProperties: true
                    description: "Реплика кандидата"
                  ai:
                    oneOf:
                      -
                        type: object
                        additionalProperties: true
                        description: "Реплика ИИ"
                      -
                        type: "null"
                  text:
                    oneOf:
                      -
                        type: string
                      -
                        type: "null"
                  audioUrl:
                    type: string
                    description: "Зарезервировано; озвучка — через /api/tts"
                  done:
                    type: boolean
                required:
                  - candidate
                  - ai
                  - text
                  - done
        "400":
          description: "Пустой текст ответа: распознаёт /audio или браузер, /turn сам STT не зовёт"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Чужой созвон или сегмент аудио"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: "Созвон завершён или ответ уже принят"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/call/consent":
    post:
      operationId: postCallConsent
      tags:
        - call
      summary: "Согласие на запись созвона"
      description: "согласие на запись созвона (транскрипт и аудио). Повтор — без дубля.\n\nНужна сессия кандидата (кука cid)."
      security:
        -
          cookieAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CallConsentBody"
      responses:
        "201":
