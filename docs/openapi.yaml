        -
          type: object
          properties:
            type:
              const: step
            text:
              type: string
          required:
            - type
            - text
          description: "Статус работы агента, например «читаю резюме…»"
        -
          type: object
          properties:
            type:
              const: queue
            position:
              type: integer
          required:
            - type
            - position
          description: "Место в очереди к модели"
        -
          type: object
          properties:
            type:
              const: ask
            question:
              type: string
            options:
              type: array
              items:
                type: string
          required:
            - type
            - question
          description: "Агент задаёт кандидату вопрос; ход на этом заканчивается"
        -
          type: object
          properties:
            type:
              const: delta
            id:
              type: string
            text:
              type: string
          required:
            - type
            - id
            - text
          description: "Очередной кусок реплики `id` по мере генерации"
        -
          type: object
          properties:
            type:
              const: discard
            id:
              type: string
          required:
            - type
            - id
          description: "Показанный текст реплики `id` не был ответом (модель ушла в инструменты): убрать"
        -
          type: object
          properties:
            type:
              const: message
            text:
              type: string
            id:
              type: string
          required:
            - type
            - text
          description: "Итог реплики, авторитетный; заменяет накопленные дельты `id`"
        -
          type: object
          properties:
            type:
              const: error
            code:
              type: string
            message:
              type: string
          required:
            - type
            - code
            - message
          description: "Ошибка хода; следом придёт `done`"
        -
          type: object
          properties:
            type:
              const: done
          required:
            - type
          description: "Последний кадр потока"
        -
          type: object
          properties:
            type:
              const: candidates
            block:
              type: object
              additionalProperties: true
              description: "Подборка: vacancy (id, title, salaryFrom) | null, total, items — карточки с псевдонимом, рангом, категорией, покрытием и обоснованием"
          required:
            - type
            - block
          description: "Блок карточек кандидатов"
        -
          type: object
          properties:
            type:
              const: invitation_draft
            draft:
              type: object
              additionalProperties: true
              description: "Черновик приглашения: candidateId, alias, vacancyId, salaryFrom, salaryTo, message, limit {sent, limit, left}, blocked"
          required:
            - type
            - draft
          description: "Черновик приглашения; отправляет человек"
        -
          type: object
          properties:
            type:
              const: need_draft
            draft:
              type: object
              additionalProperties: true
              description: "Черновик потребности: title, specialization, grade, stack, salaryFrom/To, needs, formHref"
          required:
            - type
            - draft
          description: "Черновик потребности; подтверждает человек"
      discriminator:
        propertyName: type
    EmployerQuestionInput:
      type: object
      properties:
        candidateId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
        text:
          type: string
          minLength: 5
          maxLength: 1000
        projectSubmissionId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
      required:
        - candidateId
        - text
    ErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: "Машинный код ошибки"
            message:
              type: string
              description: "Текст для человека"
            details:
              description: "Подробности, например список полей при `validation_failed`"
          required:
            - code
            - message
      required:
        - error
      description: "Единый формат ошибки API (server/errors.ts)"
    FavoriteInput:
      type: object
      properties:
        kind:
          type: string
          enum:
            - vacancy
            - candidate
        targetId:
          type: string
          minLength: 1
          maxLength: 100
        saved:
          type: boolean
      required:
        - kind
        - targetId
        - saved
      additionalProperties: false
    GrantConsentBody:
      type: object
      properties:
        kind:
          type: string
          enum:
            - pd_processing
            - call_recording
            - ai_assessment
            - employer_visibility
            - research
            - marketing
            - identity_disclosure
            - employer_offer
            - employer_data_obligation
        version:
          type: string
          minLength: 1
          maxLength: 64
        context:
          anyOf:
            -
              type: object
              properties:
                invitationId:
                  type: string
                  minLength: 1
                  maxLength: 64
            -
              type: "null"
      required:
        - kind
        - version
    InterruptBody:
      type: object
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        heardSentences:
          type: integer
          minimum: 0
          maximum: 64
      required:
        - index
        - heardSentences
    InvitationAction:
      type: object
      properties:
        action:
          type: string
          enum:
            - accept
            - decline
        disclosureVersion:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - action
    InvitationInput:
      type: object
      properties:
        candidateId:
          type: string
          minLength: 1
          maxLength: 64
        vacancyId:
          anyOf:
            -
              type: string
              minLength: 1
              maxLength: 64
            -
              type: "null"
        message:
          type: string
          minLength: 10
          maxLength: 2000
        salaryFrom:
          type: integer
          minimum: 1
          maximum: 10000000
        salaryTo:
          type: integer
          minimum: 1
          maximum: 10000000
        matchRank:
          anyOf:
            -
              type: integer
              minimum: 1
              maximum: 1000
            -
              type: "null"
        matchSource:
          anyOf:
            -
              type: string
              enum:
                - matching
                - search
                - favorites
                - assistant
                - other
            -
              type: "null"
      required:
        - candidateId
        - message
        - salaryFrom
        - salaryTo
    InviteToDefenseInput:
      type: object
      properties:
        message:
          type: string
          minLength: 10
          maxLength: 2000
        salaryFrom:
          type: integer
          minimum: 1
          maximum: 10000000
        salaryTo:
          type: integer
          minimum: 1
          maximum: 10000000
      required:
        - message
        - salaryFrom
        - salaryTo
    JoinCallInput:
      type: object
      properties:
        recordingConsent:
          type: boolean
    LiveCancelInput:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 300
      required:
        - reason
    LiveChooseInput:
      type: object
      properties:
        slotId:
          type: string
          minLength: 1
          maxLength: 64
        recordingConsentVersion:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - slotId
    LiveDefense:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - slots_proposed
            - scheduled
            - done
            - cancelled
            - no_show
        durationMin:
          type: integer
          description: "30 или 45"
        comment:
          oneOf:
            -
              type: string
            -
              type: "null"
        createdAt:
          type: string
          format: date-time
        slots:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              startsAt:
                type: string
                description: "UTC; интерфейс показывает по МСК"
                format: date-time
              endsAt:
                type: string
                format: date-time
              available:
                type: boolean
                description: "false — время занято другим кандидатом компании или прошло"
            required:
              - id
              - startsAt
              - endsAt
              - available
        noneFit:
          oneOf:
            -
              type: object
              properties:
                at:
                  type: string
                  format: date-time
                comment:
                  type: string
              required:
                - at
                - comment
            -
              type: "null"
        scheduled:
          oneOf:
            -
              type: object
              properties:
                slotId:
                  type: string
                startsAt:
                  type: string
                  format: date-time
                endsAt:
                  type: string
                  format: date-time
                roomOpensAt:
                  type: string
                  description: "за 10 минут до начала"
                  format: date-time
                roomOpen:
                  type: boolean
                callSessionId:
                  oneOf:
                    -
                      type: string
                    -
                      type: "null"
                roomHref:
                  oneOf:
                    -
                      type: string
                      description: "/defense-room/:id кандидату, /employer/calls/:id работодателю"
                    -
                      type: "null"
              required:
                - slotId
                - startsAt
                - endsAt
                - roomOpensAt
                - roomOpen
                - callSessionId
                - roomHref
            -
              type: "null"
        cancelled:
          oneOf:
            -
              type: object
              properties:
                at:
                  type: string
                  format: date-time
                by:
                  type: string
                  enum:
                    - candidate
                    - employer
                reason:
                  type: string
              required:
                - at
                - by
                - reason
            -
              type: "null"
        noShow:
          type: array
          items:
            type: string
            enum:
              - candidate
              - employer
          description: "Опоздание больше 15 минут: кто не пришёл (вычисляется при чтении)"
        canCancel:
          type: boolean
          description: "Отменить можно сейчас (не позднее чем за 1 час)"
      required:
        - id
        - status
        - durationMin
        - comment
        - createdAt
        - slots
        - noneFit
        - scheduled
        - cancelled
        - noShow
        - canCancel
      description: "Живая защита по приглашению (ADR 0008): активное предложение слотов и подстатус"
    LiveNoneFitInput:
      type: object
      properties:
        comment:
          type: string
          minLength: 3
          maxLength: 300
      required:
        - comment
    LiveSlotsInput:
      type: object
      properties:
        slots:
          minItems: 2
          maxItems: 5
          type: array
          items:
            type: string
            minLength: 10
            maxLength: 40
        durationMin:
          anyOf:
            -
              type: number
              const: 30
            -
              type: number
              const: 45
        comment:
          anyOf:
            -
              type: string
              maxLength: 300
            -
              type: "null"
      required:
        - slots
        - durationMin
    MemoryBody:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - text
    MuteAiInput:
      type: object
      properties:
        muted:
          type: boolean
      required:
        - muted
    ObjectionBody:
      type: object
      properties:
        subject:
          type: string
          enum:
            - grade_test
            - call
            - defense
        subjectId:
          type: string
          minLength: 1
          maxLength: 64
        text:
          type: string
          minLength: 10
          maxLength: 4000
      required:
        - subject
        - subjectId
        - text
    OnboardingView:
      type: object
      additionalProperties: true
      description: "Состояние онбординга: name, role, scenario, consent {version, docUrl}, progress {done, total}, history, current (шаг), summary, laterTarget, test {href, ready}, onboarded"
    PrivacyInput:
      type: object
      properties:
        hiddenFromEmployers:
          type: boolean
      required:
        - hiddenFromEmployers
    ProjectTaskInput:
      type: object
      properties:
        templateId:
          type: string
          minLength: 3
          maxLength: 64
        subcategoryId:
          type: string
          maxLength: 64
        requiredCatalogIds:
          default: []
          maxItems: 8
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
        wishesText:
          anyOf:
            -
              type: string
              maxLength: 2000
            -
              type: "null"
        visibility:
          default: open
          type: string
          enum:
            - open
            - invited
        deadlineDays:
          anyOf:
            -
              type: integer
              minimum: 1
              maximum: 30
            -
              type: "null"
    ResumeFieldAction:
      oneOf:
        -
          type: object
          properties:
            action:
              type: string
              const: accept
            key:
              type: string
              enum:
                - name
                - contact
                - experienceYears
                - roles
                - softSkills
          required:
            - action
            - key
        -
          type: object
          properties:
            action:
              type: string
              const: dismiss
            key:
              type: string
              enum:
                - name
                - contact
                - experienceYears
                - roles
                - softSkills
          required:
            - action
            - key
        -
          type: object
          properties:
            action:
              type: string
              const: set
            key:
              type: string
              enum:
                - name
                - experienceYears
                - roles
                - softSkills
            value: {}
          required:
            - action
            - key
            - value
    SayInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
      required:
        - text
    SettingsInput:
      type: object
      properties:
        skills:
          maxItems: 5
          type: array
          items:
            type: string
            enum:
              - test_prep
              - invite_review
              - brief
              - code_examples
              - wording
          description: "id включённых скиллов"
        custom:
          description: "Свои инструкции, до 500 символов"
          anyOf:
            -
              type: string
              maxLength: 500
            -
              type: "null"
      required:
        - skills
      additionalProperties: false
    SignalInput:
      type: object
      properties:
        to:
          type: string
          maxLength: 80
        sdp:
          type: object
          properties:
            type:
              type: string
              enum:
                - offer
                - answer
                - pranswer
                - rollback
            sdp:
              type: string
              maxLength: 20000
          required:
            - type
        ice:
          anyOf:
            -
              type: object
              properties:
                candidate:
                  type: string
                  maxLength: 1000
                sdpMid:
                  anyOf:
                    -
                      type: string
                      maxLength: 64
                    -
                      type: "null"
                sdpMLineIndex:
                  anyOf:
                    -
                      type: integer
                      minimum: 0
                      maximum: 64
                    -
                      type: "null"
                usernameFragment:
                  anyOf:
                    -
                      type: string
                      maxLength: 256
                    -
                      type: "null"
              required:
                - candidate
            -
              type: "null"
    StartCallBody:
      type: object
      properties:
        kind:
          default: qualifying
          type: string
          enum:
            - qualifying
            - defense
            - interview
        projectSubmissionId:
          type: string
          minLength: 1
          maxLength: 64
    SubmissionInput:
      type: object
      properties:
        repoUrl:
          type: string
          minLength: 10
          maxLength: 300
        aiLogText:
          default: ""
          type: string
          maxLength: 20000
        commitSha:
          type: string
          pattern: "^[0-9a-f]{7,40}$"
      required:
        - repoUrl
    TurnBody:
      type: object
      properties:
        text:
          type: string
          maxLength: 4000
        audioRef:
          type: string
          pattern: "^\\d{3}\\.wav$"
      required:
        - text
    VacancyInput:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        specialization:
          type: string
          enum:
            - backend
            - frontend
            - ai
            - engineering
        grade:
          type: string
          enum:
            - junior
            - middle
            - senior
        salaryFrom:
          type: integer
          minimum: 0
          maximum: 10000000
        salaryTo:
          type: integer
          minimum: 0
          maximum: 10000000
        teamDescription:
          anyOf:
            -
              type: string
              maxLength: 2000
            -
              type: "null"
        description:
          anyOf:
            -
              type: string
              maxLength: 2000
            -
              type: "null"
        stack:
          default: []
          maxItems: 15
          type: array
          items:
            type: string
            maxLength: 40
        subcategoryId:
          type: string
          minLength: 1
          maxLength: 64
        needs:
          minItems: 1
          maxItems: 25
          type: array
          items:
            type: object
            properties:
              catalogId:
                type: string
                minLength: 1
                maxLength: 64
              weight:
                type: integer
                minimum: 1
                maximum: 3
            required:
              - catalogId
              - weight
      required:
        - title
        - specialization
        - grade
        - salaryFrom
        - salaryTo
        - subcategoryId
        - needs
    VacancyPatch:
      type: object
      properties:
        archived:
          type: boolean
      required:
        - archived
    WithdrawInvitationInput:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 300
      required:
        - reason
  responses:
    BadRequest:
      description: "Некорректный запрос: тело или query не прошли проверку (`validation_failed`, `details` — список полей) либо иная ошибка запроса (`bad_request`)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Unauthorized:
      description: "Нет входа (`unauthorized`) или кука подписана верно, а аккаунта в БД нет (`session_stale`, клиент ведёт на /auth)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Forbidden:
      description: "Нет доступа: другая роль (`forbidden`) или чужой Origin у изменяющего запроса"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: "Объект не найден; для чужих объектов тоже 404, чтобы не раскрывать их существование (`not_found`)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Conflict:
      description: "Конфликт состояния: повторное действие, занятый ресурс, устаревшая версия (`conflict` и специальные коды операции)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
    PayloadTooLarge:
      description: "Слишком большой запрос (`payload_too_large`)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
    UnsupportedMediaType:
      description: "Неподдерживаемый тип содержимого (`unsupported_media_type`)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
    UnprocessableEntity:
      description: "Запрос корректен, но действие невозможно из-за состояния данных: у компании нет способа связи (`company_contact_required`) или у кандидата нет теста для выбранной категории (`no_test`, `subcategory_required`)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
    TooManyRequests:
      description: "Превышен лимит запросов или суточный лимит (`rate_limited`)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
    InternalError:
      description: "Внутренняя ошибка (`internal`); текст исключения наружу не отдаётся"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
    ServiceUnavailable:
      description: "Внешняя служба недоступна, например SMTP (`mail_unavailable`); повторить позже"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
