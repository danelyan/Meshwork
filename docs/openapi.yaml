                  db:
                    type: string
                    enum:
                      - up
                      - down
                  llm:
                    type: string
                    description: "Провайдер LLM или misconfigured"
                  time:
                    type: string
                    format: date-time
                required:
                  - ok
                  - db
                  - llm
                  - time
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: "БД недоступна или LLM настроен неверно; тело той же формы"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  db:
                    type: string
                    enum:
                      - up
                      - down
                  llm:
                    type: string
                  time:
                    type: string
                    format: date-time
                required:
                  - ok
                  - db
                  - llm
                  - time
