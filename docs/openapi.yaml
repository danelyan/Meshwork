          $ref: "#/components/responses/InternalError"
    post:
      operationId: postDemoLogin
      tags:
        - demo
      summary: "Войти в демо-аккаунт"
      description: "Вход за демо-аккаунт: новый пользователь (`fresh` с версией согласия), перезапуск онбординга, готовый демо-кандидат или демо-работодатель. Выставляет куку cid. Не-демо аккаунты — 404.\n\nВход не нужен."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              anyOf:
                -
                  type: object
                  properties:
                    fresh:
                      type: boolean
                      const: true
                    consent:
                      type: string
                      minLength: 1
                      maxLength: 64
                  required:
                    - fresh
                    - consent
                -
                  type: object
                  properties:
                    restartUserId:
                      type: string
                      minLength: 1
                      maxLength: 64
                  required:
                    - restartUserId
                -
                  type: object
                  properties:
                    restartCandidateId:
                      type: string
                      minLength: 1
                      maxLength: 64
                  required:
                    - restartCandidateId
                -
                  type: object
                  properties:
                    candidateId:
                      type: string
                      minLength: 1
                      maxLength: 64
                  required:
                    - candidateId
                -
                  type: object
                  properties:
                    employerUserId:
                      type: string
                      minLength: 1
                      maxLength: 64
                  required:
                    - employerUserId
      responses:
        "200":
          description: "Вход выполнен; в ответе `next` — куда вести"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  next:
                    type: string
                required:
