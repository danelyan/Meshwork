# Стенд: `docker compose up --build`. Локальная разработка — без Docker (scripts/db-local.sh).
# Секреты — в .env рядом (SESSION_SECRET, ключи LLM); DATABASE_URL здесь переопределён на сервис db.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: fsp
      POSTGRES_DB: fsp
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., target: builder }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fsp:fsp@db:5432/fsp
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runner }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fsp:fsp@db:5432/fsp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  db-data:
